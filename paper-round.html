<script>
/* GENERATED FILE — do not edit. Built from:
 *   src/game/state.js
 *   src/core/math.js
 *   src/core/canvas.js
 *   src/core/projection.js
 *   src/core/palette.js
 *   src/game/particles.js
 *   src/game/level.js
 *   src/core/audio.js
 *   src/game/throwing.js
 *   src/game/actions.js
 *   src/game/update.js
 *   src/game/flow.js
 *   src/game/input.js
 *   src/core/draw.js
 *   src/render/background.js
 *   src/render/houses.js
 *   src/render/landmarks.js
 *   src/render/props.js
 *   src/render/obstacles.js
 *   src/render/crossings.js
 *   src/render/effects.js
 *   src/render/rider.js
 *   src/render/hud.js
 *   src/render/screens.js
 *   src/render/scene.js
 *   src/main.js
 * Edit those and re-run: npm run build
 */
(function(){
"use strict";

/* ---- game/state.js ---- */
// The single mutable game state object. Every module reads and writes this one.
var S = {
  mode:'title', level:1, score:0, lives:3, best:0,
  trackPos:0, trackLen:0, speed:8.5,
  lane:1, px:0, lean:0,

  /* camera: bob and a little lateral lag behind the rider, so lane changes
     have weight instead of snapping */
  camX:0, camBob:0, camRoll:0, focal:330,

  papers:0, delivered:0, need:0, targets:0,
  objs:[], shots:[], pops:[], dust:[],

  /* road curvature, sampled every CURVE_STEP units by buildLevel */
  curve:null, junctions:[], turnSign:0, turnT:0,

  t:0, stun:0, shake:0, combo:0,
  arm:0, armSide:1,
  tutorial:0, perfect:false, failed:false,
  callout:'', calloutT:0, calloutCol:'#fff'
};

/* ---- core/math.js ---- */
// Small numeric helpers. No canvas, no state.
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function shade(hex,amt){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=clamp(Math.round(r+255*amt),0,255); g=clamp(Math.round(g+255*amt),0,255); b=clamp(Math.round(b+255*amt),0,255);
  return 'rgb('+r+','+g+','+b+')';
}

function pick2(seed, arr){ return arr[Math.floor(seed)%arr.length]; }

/* ---- core/canvas.js ---- */
// Backing canvas: fixed 400x700 design space, scaled to the device pixel ratio.
var DW = 400, DH = 700;
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(DW*dpr); cv.height = Math.round(DH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
if (typeof window !== 'undefined' && window.addEventListener){ resize(); window.addEventListener('resize', resize); }

/* ---- core/projection.js ---- */
// The pinhole camera that turns world (x, z) into screen (x, y).
//
// Note the convention: callers pass RELATIVE depth (o.z - S.trackPos), not
// absolute z. The camera keeps its own copy of where the rider is so it can
// look the road curvature up without importing game state.

var HORIZON = 250;
var CAMH = 1.6;
var FOCAL_BASE = 330;              // wide lens: the street reads wide
var ROAD_HALF = 1.35;
var LANES = [-0.80, 0, 0.80];
var HOUSE_X = 2.70;
var FLIGHT = 0.45;                 // seconds a paper spends in the air
var LEAD   = 1.6;                  // how far ahead of you it lands

/* Focal length breathes with speed: the faster you ride, the wider the lens
   pulls. Subtle and clamped — it also shifts where papers appear to land. */
var focal = FOCAL_BASE;
function setFocal(f){ focal = f; }

/* ---- road curvature -------------------------------------------------------
   The street is still a straight z axis; a curve is a lateral offset applied
   to the road centre at each depth. Sampled into a table when the level is
   built, so a lookup is a lerp rather than an integration. Everything drawn
   through sxAt() bends with the road for free — houses, obstacles, papers in
   flight, all of it. */
var curveTable = null, curveStep = 1, camZ = 0;

function setCurveTable(table, step){ curveTable = table; curveStep = step || 1; }
function setCamZ(z){ camZ = z; }

function curveAt(z){
  if(!curveTable) return 0;
  var f = z/curveStep;
  if(f <= 0) return curveTable[0];
  var i = f|0;
  if(i >= curveTable.length-1) return curveTable[curveTable.length-1];
  var frac = f-i;
  return curveTable[i]*(1-frac) + curveTable[i+1]*frac;
}

/* How far the road has slid sideways, `rel` units ahead of the rider. */
function bendAt(rel){ return curveAt(camZ+rel) - curveAt(camZ); }

/* Heading of the road right under the rider — used to lean the bike. */
function headingAt(rel){
  var a = curveAt(camZ+rel), b = curveAt(camZ+rel+2);
  return (b-a)/2;
}

function yAt(rel){ return HORIZON + CAMH*focal/rel; }
function ppuAt(rel){ return focal/rel; }
function sxAt(x,rel,px){ return DW/2 + (x - px + bendAt(rel))*ppuAt(rel); }

{ HORIZON, CAMH, FOCAL_BASE, ROAD_HALF, LANES, HOUSE_X, FLIGHT, LEAD,
         yAt, ppuAt, sxAt, setFocal, setCurveTable, setCamZ, curveAt, bendAt, headingAt };

/* ---- core/palette.js ---- */
// Every colour in the game, in one place.
//
// The round happens at dawn, so the palette is built around a low sun: cool
// blue overhead falling to amber and peach at the horizon, warm light on the
// east faces of buildings, and haze in the distance.
var C = {
  /* early-morning sky, top to bottom */
  skyTop:'#3f7fb8', skyMid:'#8fb6d4', skyLow:'#f2d3a8', skyGlow:'#ffc98a',
  sun:'#fff0c2', sunHalo:'rgba(255,200,120,0.40)',

  /* distance: everything far away sits in warm mist */
  haze:'#e8dcc4', hazeSoft:'rgba(232,220,196,0.85)',
  far:'#a8a89e', far2:'#918f8a',

  field:'#a8bc6c', field2:'#8fa65a', dryGrass:'#cbbd7c',
  shoulder:'#c9ae7c', road:'#6b6660', roadLite:'#78736c', patch:'#5a5650',
  lane:'#efe2ad',
  ink:'#23252a',

  /* warm morning light and the shadow it throws */
  warm:'rgba(255,196,120,0.20)', warmStrong:'rgba(255,186,104,0.34)',
  coolShadow:'rgba(48,62,96,0.16)',

  pin:'#ff8a15', pinDone:'#22bd58',
  paper:'#fdfbf0', paperInk:'#c4452f',
  hud:'#ffffff', hudDim:'rgba(255,255,255,0.66)', panel:'rgba(14,20,30,0.9)',
  bad:'#e8503a', good:'#22bd58', gold:'#ffc63a',
  saffron:'#ff9933', green:'#138808', chakra:'#000088',

  /* landmarks */
  temple:'#f2e2c4', templeTrim:'#d4553a', templeGold:'#e8b93a',
  school:'#f0e6d0', schoolTrim:'#3f7fbf',
  govt:'#e8e0cc', govtTrim:'#9c3f34'
};
var WALLS = ['#f6e7c6','#dfeadb','#efd9c6','#d9e8f2','#eadfef','#f2e3cf','#cfe3d8'];
var ROOFS = ['#b4573f','#7d8a97','#9c6b4a','#5f7f8c','#a8724f'];

/* ---- game/particles.js ---- */
// Pooled dust. The old code pushed and spliced a fresh object every puff,
// which is a steady drip of garbage on the hot path; this reuses a fixed
// pool so a long run allocates nothing (claude.md section 7).

var MAX = 140;
var cursor = 0;

function initDust(){
  if(S.dust.length === MAX) { resetDust(); return; }
  S.dust.length = 0;
  for(var i=0;i<MAX;i++) S.dust.push({ x:0, z:0, t:0, r:0, active:false });
  cursor = 0;
}

function resetDust(){
  for(var i=0;i<S.dust.length;i++) S.dust[i].active = false;
  cursor = 0;
}

/* Oldest puff is recycled once the pool is full — dust is the least
   important thing on screen, so dropping one is invisible. */
function spawnDust(x,z,r){
  var d = S.dust[cursor];
  cursor = (cursor+1) % S.dust.length;
  d.x = x; d.z = z; d.r = r; d.t = 1; d.active = true;
}

function updateDust(dt){
  var arr = S.dust;
  for(var i=0;i<arr.length;i++){
    var d = arr[i];
    if(!d.active) continue;
    d.t -= dt*1.6;
    if(d.t <= 0) d.active = false;
  }
}

/* ---- game/level.js ---- */
// Procedurally lays out one street: houses, landmarks, the round, verge
// dressing, crossroads, obstacles and bundles.

var CURVE_STEP = 2;

/* ---- difficulty ----------------------------------------------------------
   Every one of these rises with the level and none of them ever stops rising,
   but speed and obstacle density approach a ceiling rather than climbing in a
   straight line — a linear ramp is unplayable by level 12 and the whole point
   is that it stays playable. The quota and the street length keep growing
   linearly, so later levels are longer and denser rather than merely faster. */
function speedFor(n){ return 8.5 + 3.4*(1 - Math.pow(0.86, n)) + Math.min(n,30)*0.03; }
function targetsFor(n){ return 5 + n; }
/* Spacing is a reaction time, not a distance: as speed climbs, the gap in
   metres has to climb with it or the street stops being dodgeable. Floors at
   about 1.25s between decisions. */
function gapTimeFor(n){ return 2.00 - 0.72*(1 - Math.pow(0.87, n)); }
function twoLaneChance(n){ return Math.min(0.32, 0.08 + n*0.026); }

function buildLevel(n){
  S.level = n;
  S.speed    = speedFor(n);
  S.targets  = targetsFor(n);
  S.trackLen = 170 + S.targets*22;
  S.trackPos = 0; S.lane = 1; S.px = 0; S.lean = 0;
  S.camX = 0; S.camBob = 0; S.camRoll = 0;
  S.delivered = 0; S.combo = 0; S.stun = 0; S.shake = 0; S.arm = 0;
  S.objs = []; S.shots = []; S.pops = []; resetDust();
  S.perfect = false; S.turnSign = 0; S.turnT = 0;

  var z, side, i;

  /* ---- crossroads, and the bend the rider takes through each one ----------
     A junction is a side street crossing the round. Just past it the road
     swings hard one way and straightens again: heading rises to a peak and
     returns to zero, so the world stays on a single z axis while the ride
     reads as turning a corner. */
  S.junctions = [];
  var jz = rnd(78, 116);
  while(jz < S.trackLen - 55){
    S.junctions.push({
      z: jz,
      turnZ: jz + 6,
      turnLen: 38,
      /* peak heading, in world-x per world-z */
      H: (Math.random()<0.5?-1:1) * rnd(0.17, 0.27),
      seed: Math.random()*10
    });
    jz += rnd(118, 168);
  }
  buildCurve();

  function nearJunction(zz, pad){
    for(var k=0;k<S.junctions.length;k++)
      if(Math.abs(S.junctions[k].z - zz) < pad) return true;
    return false;
  }

  /* ---- landmarks: temple, school, government office ----------------------
     Placed first so houses can give way to them. They are never on the round;
     they are there so the street has civic landmarks, not just frontage. */
  var landmarkTypes = ['temple','school','govt'];
  var lz = rnd(46, 72);
  var usedTypes = [];
  while(lz < S.trackLen - 30){
    var lt = pick(landmarkTypes);
    if(usedTypes.length && usedTypes[usedTypes.length-1]===lt) lt = pick(landmarkTypes);
    usedTypes.push(lt);
    var lside = (Math.random()<0.5?-1:1);
    S.objs.push({
      kind:'landmark', type:lt, side:lside, x:lside*(HOUSE_X+0.34), z:lz,
      w: lt==='school' ? rnd(3.4,4.0) : lt==='govt' ? rnd(2.9,3.3) : rnd(2.1,2.5),
      h: lt==='temple' ? rnd(2.2,2.6) : rnd(1.7,2.0),
      seed: Math.random()*10
    });
    lz += rnd(88, 132);
  }
  function nearLandmark(zz, sd){
    for(var k=0;k<S.objs.length;k++){
      var o = S.objs[k];
      if(o.kind==='landmark' && o.side===sd && Math.abs(o.z-zz) < o.w*1.5+2.2) return true;
    }
    return false;
  }

  /* ---- frontage both sides ---- */
  for(side=-1; side<=1; side+=2){
    z = rnd(14,20);
    while(z < S.trackLen + 80){
      if(!nearJunction(z, 9) && !nearLandmark(z, side)){
        S.objs.push({
          kind:'house', side:side, x:side*HOUSE_X, z:z,
          w:rnd(1.75,2.05), h:rnd(1.6,2.0),
          wall:pick(WALLS), roof:pick(ROOFS),
          storey:(Math.random()<0.30?2:1),
          shop:(Math.random()<0.28),
          target:false, done:false, claimed:false, tried:false,
          seed:Math.random()*10
        });
      }
      z += rnd(3.4,5.0);
    }
  }

  /* ---- the round ---- */
  var cand = S.objs.filter(function(o){
    return o.kind==='house' && o.z>26 && o.z<S.trackLen-8;
  });
  cand.sort(function(a,b){ return a.z-b.z; });
  var step = cand.length/S.targets, placed = 0;
  for(i=0;i<S.targets;i++){
    var idx = Math.min(cand.length-1, Math.round(i*step + rnd(0, step*0.5)));
    if(cand[idx] && !cand[idx].target){ cand[idx].target=true; cand[idx].shop=false; placed++; }
  }
  S.targets = placed;
  S.need = Math.max(3, Math.ceil(S.targets*0.65));

  /* Papers are scarce on purpose: the quota plus two. Every wasted throw is
     felt, and bundles on the road are the only way back. */
  S.papers = S.need + 2;

  /* ---- verge dressing ---- */
  for(z=12; z<S.trackLen+70; z+=rnd(5,9)){
    if(nearJunction(z,7)) continue;
    S.objs.push({ kind:'prop', type:pick(['pole','tree','tree','hoarding','handpump']),
                  x:(Math.random()<0.5?-1:1)*rnd(1.55,1.95), z:z, seed:Math.random()*10 });
  }
  /* chai stalls, hawkers, dozing dogs — the street waking up */
  for(z=30; z<S.trackLen; z+=rnd(38,64)){
    S.objs.push({ kind:'prop', type:'chai', x:(Math.random()<0.5?-1:1)*1.75, z:z, seed:Math.random()*10 });
  }
  for(z=52; z<S.trackLen; z+=rnd(42,70)){
    S.objs.push({ kind:'prop', type:'hawker', hawker:pick(['sabzi','fruit','milk','broom']),
                  x:(Math.random()<0.5?-1:1)*rnd(1.6,1.9), z:z, seed:Math.random()*10 });
  }
  for(z=45; z<S.trackLen; z+=rnd(46,74)){
    S.objs.push({ kind:'prop', type:'dog', x:(Math.random()<0.5?-1:1)*rnd(1.5,1.8), z:z, seed:Math.random()*10 });
  }
  /* bunting across the street */
  for(z=55; z<S.trackLen; z+=rnd(55,90)){
    if(nearJunction(z,10)) continue;
    S.objs.push({ kind:'bunting', x:0, z:z, seed:Math.random()*10 });
  }

  /* ---- crossing dogs -------------------------------------------------------
     These are the only hazard that can move into your lane, so they always
     telegraph: the dog is on the verge with its ears up for a beat before it
     bolts. None at all on level 1 — the first street is where players decide
     whether to keep going, so it teaches the throw and nothing else. */
  var dogGap = Math.max(54, 128 - n*6);
  for(z=(n<2 ? 1e9 : 68); z<S.trackLen-24; z+=rnd(dogGap, dogGap+50)){
    if(nearJunction(z,12)) continue;
    var from = (Math.random()<0.5?-1:1);
    S.objs.push({
      kind:'cross', type:'dog', z:z,
      from:from, x:from*1.85, x0:from*1.85, x1:-from*1.85,
      phase:'wait', t:0, checked:false,
      speed:rnd(1.5,2.1) + n*0.05,
      seed:Math.random()*10
    });
  }

  /* ---- obstacles: sparse, one free lane always reachable ---- */
  var types = ['cow','auto','thela','pothole','scooter','tempo'];
  var freeLane = 1;
  var gap = S.speed * gapTimeFor(n);
  for(z=34; z<S.trackLen-12; z+=rnd(gap, gap+6)){
    if(nearJunction(z,8)) continue;
    var opts = [freeLane-1, freeLane, freeLane+1].filter(function(l){ return l>=0&&l<=2; });
    freeLane = opts[(Math.random()*opts.length)|0];
    var others = [0,1,2].filter(function(l){ return l!==freeLane; });
    var two = Math.random() < twoLaneChance(n);
    if(!two) others = [others[(Math.random()*others.length)|0]];
    for(i=0;i<others.length;i++){
      var lane = others[i];
      var t = pick(types);
      if(t==='tempo' && lane===1) t = 'thela';
      if((t==='tempo'||t==='auto') && others.length>1) t = 'pothole';
      S.objs.push({ kind:'obs', type:t, lane:lane, x:LANES[lane], z:z+rnd(-0.4,0.4),
                    checked:false, seed:Math.random()*10,
                    vz:(t==='auto'? rnd(2.5,4) : t==='tempo'? -rnd(3,4.5) : 0) });
    }
  }

  /* ---- bundles: rarer and smaller than they were ---- */
  for(z=48; z<S.trackLen-20; z+=rnd(56,86)){
    if(nearJunction(z,7)) continue;
    var ln = (Math.random()*3)|0;
    S.objs.push({ kind:'pickup', lane:ln, x:LANES[ln], z:z, amount:3, taken:false, checked:false });
  }

  S.objs.sort(function(a,b){ return a.z-b.z; });
}

/* Integrate the junction bends into a lookup table of lateral road offset.
   heading rises to H at the middle of the bend and returns to zero, so the
   road ends up shifted sideways but pointing straight again. */
function buildCurve(){
  var len = Math.ceil((S.trackLen + 160)/CURVE_STEP) + 2;
  var table = new Float64Array(len);
  var offset = 0;
  for(var i=0;i<len;i++){
    var z = i*CURVE_STEP;
    var heading = 0;
    for(var k=0;k<S.junctions.length;k++){
      var j = S.junctions[k];
      var t = (z - j.turnZ)/j.turnLen;
      if(t>0 && t<1) heading += j.H*Math.sin(Math.PI*t);
    }
    offset += heading*CURVE_STEP;
    table[i] = offset;
  }
  S.curve = table;
  setCurveTable(table, CURVE_STEP);
}

/* How hard the road is bending where the rider is, for lean and camera roll. */
function bendHeading(z){
  var heading = 0;
  for(var k=0;k<S.junctions.length;k++){
    var j = S.junctions[k];
    var t = (z - j.turnZ)/j.turnLen;
    if(t>0 && t<1) heading += j.H*Math.sin(Math.PI*t);
  }
  return heading;
}

/* ---- core/audio.js ---- */
// WebAudio, synthesised. Nothing is loaded from disk, so there are no sample
// licences to track (claude.md section 4.7) and the build stays dependency-free.
// Silent if the browser has no AudioContext.
var actx=null, muted=false;

function ctxOrNull(){
  if(typeof window==='undefined') return null;
  try{
    if(!actx){
      var A = window.AudioContext||window.webkitAudioContext;
      if(!A) return null;
      actx = new A();
    }
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}

function blip(f,d,type){
  if(muted) return;
  var a = ctxOrNull(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'triangle'; o.frequency.value=f; g.gain.value=0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d);
  }catch(e){}
}

/* ---- the scooter ----------------------------------------------------------
   A Bajaj two-stroke single: a buzzy ring-ding, not a smooth hum. Built from
   a sawtooth at the firing frequency, a detuned octave above it for the rasp,
   a square an octave below for the thump, and a little filtered noise for
   intake roar. A lowpass opens as the revs climb. */
var eng = null;

function startEngine(){
  if(eng) return;
  var a = ctxOrNull(); if(!a) return;
  try{
    var out = a.createGain();       out.gain.value = 0;
    var lp  = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=6;

    var saw  = a.createOscillator(); saw.type='sawtooth';
    var rasp = a.createOscillator(); rasp.type='sawtooth'; rasp.detune.value = 14;
    var sub  = a.createOscillator(); sub.type='square';

    var gSaw = a.createGain();  gSaw.gain.value  = 0.55;
    var gRasp= a.createGain();  gRasp.gain.value = 0.22;
    var gSub = a.createGain();  gSub.gain.value  = 0.30;

    /* two seconds of white noise, looped, for the intake */
    var frames = a.sampleRate*2;
    var buf = a.createBuffer(1, frames, a.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<frames;i++) d[i] = Math.random()*2-1;
    var noise = a.createBufferSource(); noise.buffer=buf; noise.loop=true;
    var bp = a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.7;
    var gN = a.createGain(); gN.gain.value = 0.06;

    saw.connect(gSaw).connect(lp);
    rasp.connect(gRasp).connect(lp);
    sub.connect(gSub).connect(lp);
    noise.connect(bp).connect(gN).connect(lp);
    lp.connect(out).connect(a.destination);

    saw.start(); rasp.start(); sub.start(); noise.start();
    eng = { a:a, out:out, lp:lp, saw:saw, rasp:rasp, sub:sub, noise:noise, level:0 };
    setEngine(0.35);
  }catch(e){ eng = null; }
}

/* load: 0 idling, 1 flat out. Ramped, never stepped, or it clicks. */
function setEngine(load){
  if(!eng) return;
  try{
    var a = eng.a, now = a.currentTime, k = clamp01(load);
    var f = 46 + k*58;                        // firing frequency, Hz
    var vol = muted ? 0 : 0.030 + k*0.028;
    eng.saw .frequency.setTargetAtTime(f,      now, 0.08);
    eng.rasp.frequency.setTargetAtTime(f*2.01, now, 0.08);
    eng.sub .frequency.setTargetAtTime(f*0.5,  now, 0.08);
    eng.lp  .frequency.setTargetAtTime(380 + k*900, now, 0.10);
    eng.out .gain     .setTargetAtTime(vol,    now, 0.10);
    eng.level = k;
  }catch(e){}
}

function stopEngine(){
  if(!eng) return;
  try{
    eng.out.gain.setTargetAtTime(0, eng.a.currentTime, 0.08);
    var e = eng; eng = null;
    setTimeout(function(){
      try{ e.saw.stop(); e.rasp.stop(); e.sub.stop(); e.noise.stop(); }catch(x){}
    }, 400);
  }catch(e){ eng = null; }
}

function clamp01(v){ return v<0?0:v>1?1:v; }

function toggleMute(){
  muted = !muted;
  if(eng) setEngine(eng.level);      // re-apply, which folds the mute into the gain
  return muted;
}
/* Browsers start the context suspended until the first gesture. */
function resumeAudio(){ ctxOrNull(); }

/* ---- game/throwing.js ---- */
// Throw timing: which house you are aiming at, and how well you timed it.

/* the paper lands here, in world z, if thrown right now */
function landZ(){ return S.trackPos + S.speed*FLIGHT + LEAD; }
var PERFECT_TOL = 1.5, HIT_TOL = 3.4;

function findTarget(side){
  var best=null, bd=1e9;
  for(var i=0;i<S.objs.length;i++){
    var o = S.objs[i];
    if(o.kind!=='house' || !o.target || o.done || o.claimed) continue;
    if(o.side!==side) continue;
    var rel = o.z - S.trackPos;
    if(rel < -2 || rel > 30) continue;
    if(rel < bd){ bd=rel; best=o; }
  }
  return best;
}
/* 0 when the house is far, 1 when the paper would land past it */
function aimProgress(house){
  var span = 30;
  var err = house.z - landZ();          // +ve: house still ahead of the landing point
  return clamp(1 - (err/span + 0.5) + 0.5, 0, 1);
}

function toss(side){
  if(S.mode!=='play' || S.stun>0 || S.arm>0) return;
  if(S.papers<=0){ callout('NO PAPERS LEFT', C.bad); return; }
  var tgt = findTarget(side);
  S.papers--;
  S.arm = 0.34; S.armSide = side;

  var lz = landZ();
  var err = tgt ? (tgt.z - lz) : 0;
  var grade = 'miss';
  if(tgt){
    if(Math.abs(err) <= PERFECT_TOL) grade = 'perfect';
    else if(Math.abs(err) <= HIT_TOL) grade = 'hit';
    else grade = (err > 0) ? 'early' : 'late';
  }
  if(grade === 'miss') { S.combo = 0; S.score = Math.max(0, S.score-15); }
  if(grade === 'early' || grade === 'late'){ S.combo = 0; }
  if(tgt && (grade==='perfect'||grade==='hit')) tgt.claimed = true;

  S.shots.push({
    side:side, t:0, house:tgt, grade:grade,
    landZ: lz, landX: side*(HOUSE_X - (grade==='perfect'||grade==='hit' ? 0.72 : 1.25)),
    spin:0
  });
  blip(grade==='perfect'?900:grade==='hit'?760:300, .07);
}
function callout(txt,col){ S.callout=txt; S.calloutCol=col; S.calloutT=1.1; }

/* ---- game/actions.js ---- */
// Player actions and their consequences.

function setLane(dir){
  if(S.mode!=='play' || S.stun>0) return;
  var nl = clamp(S.lane+dir,0,2);
  if(nl!==S.lane){ S.lane=nl; blip(400,.05); }
}
function crash(){
  if(S.stun>0) return;
  S.lives--; S.combo=0; S.stun=1.2; S.shake=16;
  callout('CRASH!', C.bad);
  blip(85,.32,'sawtooth');
  for(var i=0;i<14;i++) spawnDust(S.px+rnd(-.5,.5), S.trackPos+rnd(2.5,5), rnd(0.10,0.22));
  if(S.lives<=0){ S.mode='over'; if(S.score>S.best) S.best=S.score; }
}

/* ---- game/update.js ---- */
// One simulation step: camera, movement, crossings, papers in flight,
// collisions, end of street.

/* Approach a target with a time-constant instead of a per-frame fraction, so
   the feel does not change with framerate. rate is "how much of the gap is
   closed per second". */
function ease(cur, target, rate, dt){
  return cur + (target-cur)*(1 - Math.exp(-rate*dt));
}

function update(dt){
  S.t += dt;
  if(S.shake>0) S.shake = Math.max(0, S.shake-dt*30);
  if(S.tutorial>0) S.tutorial -= dt;
  if(S.arm>0) S.arm -= dt;
  if(S.calloutT>0) S.calloutT -= dt;
  if(S.turnT>0) S.turnT -= dt;

  setCamZ(S.trackPos);

  if(S.mode==='title'){
    S.trackPos += S.speed*0.5*dt;
    camera(dt, 0);
    updateDust(dt);
    return;
  }
  if(S.mode!=='play'){ camera(dt, 0); stopEngine(); return; }
  if(S.stun>0) S.stun -= dt;

  S.trackPos += S.speed*dt;

  /* Lane change stays as quick as it ever was — slowing it down makes dense
     streets undodgeable, which the bot caught. The smoothness comes from the
     lean, the camera lag and the roll, not from sluggish steering. */
  var tx = LANES[S.lane], d = tx - S.px;
  S.px = ease(S.px, tx, 13.0, dt);
  var road = bendHeading(S.trackPos);
  var wantLean = d*1.9 + road*3.4;
  S.lean = ease(S.lean, wantLean, 6.5, dt);

  camera(dt, road);

  /* engine note tracks speed, and dips while you are stunned */
  var load = clamp((S.speed-8.0)/5.0, 0, 1) * (S.stun>0 ? 0.55 : 1);
  setEngine(0.30 + load*0.70);

  var i,o,rel;

  for(i=0;i<S.objs.length;i++){ o=S.objs[i]; if(o.kind==='obs'&&o.vz) o.z += o.vz*dt; }

  crossings(dt);

  /* papers in flight */
  for(i=S.shots.length-1;i>=0;i--){
    var s = S.shots[i];
    s.t += dt/FLIGHT;
    s.spin += dt*10;
    if(s.t>=1){
      var puffZ = s.landZ, puffX = s.landX;
      for(var k=0;k<7;k++) spawnDust(puffX+rnd(-.15,.15), puffZ+rnd(-.15,.15), rnd(0.06,0.13));
      if(s.grade==='perfect'||s.grade==='hit'){
        if(s.house && !s.house.done){
          s.house.done = true; S.delivered++; S.combo++;
          var pts = (s.grade==='perfect'?150:100) + (S.combo-1)*25;
          S.score += pts;
          S.pops.push({ x:s.house.x, z:s.house.z, t:1, txt:'+'+pts, col:C.good });
          callout(s.grade==='perfect' ? 'PERFECT!' : 'DELIVERED', C.good);
          blip(980,.09);
        }
      } else if(s.grade==='early'){
        callout('TOO EARLY', C.bad);
        if(s.house) s.house.claimed = false;
      } else if(s.grade==='late'){
        callout('TOO LATE', C.bad);
        if(s.house) s.house.claimed = false;
      } else {
        callout('NO HOUSE THERE', C.bad);
      }
      S.shots.splice(i,1);
    }
  }

  for(i=S.pops.length-1;i>=0;i--){ S.pops[i].t -= dt*1.2; if(S.pops[i].t<=0) S.pops.splice(i,1); }
  updateDust(dt);

  /* junction warning, a beat before the bend */
  for(i=0;i<S.junctions.length;i++){
    var j = S.junctions[i];
    if(!j.warned && j.z - S.trackPos < 34){
      j.warned = true; S.turnSign = j.H<0 ? -1 : 1; S.turnT = 2.0;
      blip(520,.10,'sine');
    }
  }

  /* collisions */
  for(i=0;i<S.objs.length;i++){
    o = S.objs[i]; rel = o.z - S.trackPos;
    if(o.kind==='obs' && !o.checked && rel<0.9){
      o.checked = true;
      if(S.stun<=0 && Math.abs(o.x-S.px) < 0.42) crash();
    } else if(o.kind==='pickup' && !o.checked && rel<0.9){
      o.checked = true;
      if(Math.abs(o.x-S.px) < 0.45){
        o.taken = true; S.papers += (o.amount||3); S.score += 40;
        S.pops.push({ x:o.x, z:o.z, t:1, txt:'+'+(o.amount||3), col:C.hud });
        blip(600,.08,'sine');
      }
    } else if(o.kind==='house' && o.target && !o.done && !o.tried && rel < -3){
      o.tried = true; S.combo = 0;
    }
  }

  if(S.trackPos >= S.trackLen){
    if(S.delivered >= S.need){
      S.perfect = (S.delivered === S.targets);
      S.score += 250 + S.delivered*30 + S.papers*5;
      if(S.perfect && S.lives<5) S.lives++;
      S.failed = false; S.mode='clear'; blip(700,.12);
    } else {
      S.lives--; S.failed = true;
      if(S.lives<=0){ S.mode='over'; if(S.score>S.best) S.best=S.score; }
      else S.mode='clear';
      blip(170,.3,'sawtooth');
    }
  }
}

/* ---- camera ---------------------------------------------------------------
   Three small things that together stop the view feeling nailed down: a bob
   at engine frequency, a lateral lag so the world slides a beat behind a lane
   change, and a roll into the bend. The projection still uses the rider's
   true position — the lag is applied in screen space only, so throwing stays
   honest. */
function camera(dt, road){
  var moving = (S.mode==='play' || S.mode==='title');
  var bobAmp = moving ? 1.5 + S.speed*0.10 : 0;
  S.camBob = Math.sin(S.t*S.speed*1.15)*bobAmp + Math.sin(S.t*S.speed*2.3)*bobAmp*0.30;
  S.camX  = ease(S.camX, S.px, 7.0, dt);
  S.camRoll = ease(S.camRoll, (road||0)*0.55 + (S.px - S.camX)*0.10, 8.0, dt);
  var f = FOCAL_BASE * (1 + clamp((S.speed-8.5)*0.016, 0, 0.11));
  S.focal = f;
  setFocal(f);
}

/* ---- crossing hazards -----------------------------------------------------
   The one rule that matters (claude.md section 4.2): it must telegraph. The
   dog sits on the verge, then puts its ears up and freezes for a beat, and
   only then bolts. Anything that crosses without warning is unfair. */
function crossings(dt){
  for(var i=0;i<S.objs.length;i++){
    var o = S.objs[i];
    if(o.kind!=='cross') continue;
    var rel = o.z - S.trackPos;

    if(o.phase==='wait'){
      if(rel < 26 && rel > 0){ o.phase='alert'; o.t=0; }
    } else if(o.phase==='alert'){
      o.t += dt;
      if(o.t > 0.75){ o.phase='run'; o.t=0; blip(1150,.06,'square'); }
    } else if(o.phase==='run'){
      o.t += dt;
      var dir = o.x1 - o.x0;
      o.x += (dir>0?1:-1) * o.speed * dt;
      if((dir>0 && o.x>=o.x1) || (dir<0 && o.x<=o.x1)){ o.x = o.x1; o.phase='gone'; }
    }

    if(!o.checked && rel < 0.9){
      o.checked = true;
      if(S.stun<=0 && o.phase!=='gone' && Math.abs(o.x-S.px) < 0.44) crash();
    }
  }
}

/* ---- game/flow.js ---- */
// Moving between title, play, street-cleared and game-over.

function startGame(){
  S.level=1; S.score=0; S.lives=3; S.failed=false;
  buildLevel(1); S.tutorial=5; S.mode='play';
  startEngine();
}
function nextStreet(){
  if(S.failed){ S.failed=false; buildLevel(S.level); }
  else { buildLevel(S.level+1); }
  S.mode='play';
  startEngine();
}
function press(){
  resumeAudio();
  if(S.mode==='title') startGame();
  else if(S.mode==='clear') nextStreet();
  else if(S.mode==='over') startGame();
}
/* Cut the engine when the ride stops, so the title and game-over screens are
   quiet. update() restarts it on the next press. */
function idleAudio(){ stopEngine(); }

/* ---- game/input.js ---- */
// Pointer (swipe to steer, tap a side to throw) and keyboard controls.

function attachInput(){
  if (typeof window!=='undefined' && window.addEventListener){
    var down=null;
    cv.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var r=cv.getBoundingClientRect();
      down={ x:(e.clientX-r.left)/r.width*DW, y:(e.clientY-r.top)/r.height*DH, moved:false };
    });
    cv.addEventListener('pointermove',function(e){
      if(!down||down.moved) return;
      var r=cv.getBoundingClientRect();
      var dx=(e.clientX-r.left)/r.width*DW - down.x;
      if(Math.abs(dx)>26){ down.moved=true; setLane(dx>0?1:-1); }
    });
    cv.addEventListener('pointerup',function(){
      if(!down) return;
      var swipe=down.moved, x=down.x; down=null;
      if(S.mode!=='play'){ press(); return; }
      if(!swipe) toss(x<DW/2?-1:1);
    });
    cv.addEventListener('pointercancel',function(){ down=null; });

    window.addEventListener('keydown',function(e){
      var k=e.key.toLowerCase();
      if(['arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
      if(e.repeat) return;
      if(S.mode!=='play'){ if(k===' '||k==='enter') press(); return; }
      if(k==='arrowleft') setLane(-1);
      if(k==='arrowright') setLane(1);
      if(k==='q'||k==='a'||k==='z') toss(-1);
      if(k==='e'||k==='d'||k==='m') toss(1);
      if(k==='p') toggleMute();
    },{passive:false});
  }
}

/* ---- core/draw.js ---- */
// Thin wrappers over the 2D context so the draw code stays readable.

function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ rr(x,y,w,h,r); ctx.fillStyle=col; ctx.fill(); }
function poly(pts,col){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
function circle(x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fillStyle=col; ctx.fill(); }
function label(s,x,y,size,col,align,weight){
  ctx.font=(weight||'600')+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=col||C.hud; ctx.fillText(s,x,y);
}

/* ---- render/background.js ---- */
// Sky, distant skyline, and the road surface under the rider.
//
// The road is drawn as a single filled path sampled down the depth axis
// rather than one flat quad, because it has to follow the bend through a
// junction. Gradients are built once and cached — creating them per frame was
// the biggest avoidable cost in the loop (claude.md section 7).

/* ---- cached gradients ---- */
var gSky=null, gGround=null, gHaze=null, gHud=null;
function gradients(){
  if(gSky) return;
  gSky = ctx.createLinearGradient(0,0,0,HORIZON);
  gSky.addColorStop(0,C.skyTop); gSky.addColorStop(.55,C.skyMid);
  gSky.addColorStop(.85,C.skyLow); gSky.addColorStop(1,C.skyGlow);

  gGround = ctx.createLinearGradient(0,HORIZON,0,DH);
  gGround.addColorStop(0,C.field2); gGround.addColorStop(1,C.field);

  gHaze = ctx.createLinearGradient(0,HORIZON-6,0,HORIZON+96);
  gHaze.addColorStop(0,C.haze); gHaze.addColorStop(.45,'rgba(232,220,196,0.62)');
  gHaze.addColorStop(1,'rgba(232,220,196,0)');

  gHud = ctx.createLinearGradient(0,0,0,96);
  gHud.addColorStop(0,'rgba(10,16,26,0.55)'); gHud.addColorStop(1,'rgba(10,16,26,0)');
}
function invalidateGradients(){ gSky=gGround=gHaze=gHud=null; }
function hudGradient(){ gradients(); return gHud; }
function hazeGradient(){ gradients(); return gHaze; }

/* ---- sky ---- */
function drawSky(){
  gradients();
  ctx.fillStyle=gSky; ctx.fillRect(0,0,DW,HORIZON);

  /* low morning sun, sitting just above the haze */
  var sy = HORIZON-46;
  circle(300,sy,62,C.sunHalo);
  circle(300,sy,34,'rgba(255,222,150,0.55)');
  circle(300,sy,21,C.sun);

  ctx.globalAlpha=.7; cloud(70,56,34); cloud(196,38,26); cloud(340,86,20); ctx.globalAlpha=1;

  /* birds out early */
  ctx.strokeStyle='rgba(50,54,62,0.40)'; ctx.lineWidth=1.6;
  for(var i=0;i<4;i++){
    var bx = 96+i*32 + Math.sin(S.t*0.5+i)*9, by = 92+i*8;
    ctx.beginPath();
    ctx.moveTo(bx-6,by); ctx.quadraticCurveTo(bx-3,by-4,bx,by);
    ctx.quadraticCurveTo(bx+3,by-4,bx+6,by); ctx.stroke();
  }
}
function cloud(x,y,r){
  circle(x,y,r*.62,'rgba(255,246,232,0.92)');
  circle(x+r*.6,y+r*.12,r*.46,'rgba(255,242,222,0.92)');
  circle(x-r*.6,y+r*.16,r*.4,'rgba(255,238,214,0.92)');
  ctx.fillStyle='rgba(255,244,228,0.92)'; ctx.fillRect(x-r*.6,y,r*1.2,r*.5);
}

/* ---- distant skyline ---- */
function drawSkyline(){
  var off = -(S.trackPos*1.4)%440;
  for(var pass=0;pass<2;pass++){
    ctx.save(); ctx.translate(off+pass*440,0); ctx.globalAlpha=.42;
    ctx.fillStyle=C.far2;
    ctx.fillRect(14,HORIZON-30,52,30); ctx.fillRect(74,HORIZON-19,34,19);
    ctx.fillRect(256,HORIZON-26,58,26); ctx.fillRect(372,HORIZON-18,44,18);
    /* temple */
    poly([[118,HORIZON],[118,HORIZON-24],[132,HORIZON-58],[146,HORIZON-24],[146,HORIZON]],C.far);
    circle(132,HORIZON-62,4,C.far);
    /* mosque */
    ctx.beginPath(); ctx.arc(192,HORIZON-28,15,Math.PI,0); ctx.fillStyle=C.far; ctx.fill();
    ctx.fillRect(177,HORIZON-28,30,28); ctx.fillRect(210,HORIZON-50,6,50);
    /* water tank */
    ctx.fillStyle=C.far2;
    ctx.fillRect(320,HORIZON-50,28,15);
    ctx.fillRect(325,HORIZON-35,4,35); ctx.fillRect(340,HORIZON-35,4,35);
    /* chimney with a thread of morning smoke */
    ctx.fillRect(60,HORIZON-46,7,46);
    ctx.globalAlpha=.18;
    circle(64,HORIZON-54,7,'#fff'); circle(69,HORIZON-66,9,'#fff'); circle(62,HORIZON-80,11,'#fff');
    ctx.globalAlpha=.42;
    palm(236,HORIZON,30); palm(100,HORIZON,24);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function palm(x,ground,h){
  ctx.fillStyle=C.far2; ctx.fillRect(x-1.5,ground-h,3,h);
  ctx.strokeStyle=C.far2; ctx.lineWidth=3;
  for(var i=0;i<5;i++){
    var a=-Math.PI/2+(i-2)*.55;
    ctx.beginPath(); ctx.moveTo(x,ground-h);
    ctx.quadraticCurveTo(x+Math.cos(a)*14,ground-h+Math.sin(a)*10,x+Math.cos(a)*20,ground-h+Math.sin(a)*4);
    ctx.stroke();
  }
}

/* ---- the road -------------------------------------------------------------
   Sampled geometrically so the slices bunch up near the rider where the
   perspective changes fastest. Everything goes through sxAt(), which folds in
   the road's curvature, so the strip bends through a junction on its own. */
var Z_NEAR = 1.25, Z_FAR = 96, SLICES = 34;
var zs = (function(){
  var a = new Float64Array(SLICES+1), r = Math.pow(Z_FAR/Z_NEAR, 1/SLICES);
  for(var i=0;i<=SLICES;i++) a[i] = Z_NEAR*Math.pow(r,i);
  return a;
})();

function ribbon(half){
  ctx.beginPath();
  var i, z;
  for(i=0;i<=SLICES;i++){ z=zs[i]; ctx.lineTo(sxAt(-half,z,S.px), yAt(z)); }
  for(i=SLICES;i>=0;i--){ z=zs[i]; ctx.lineTo(sxAt( half,z,S.px), yAt(z)); }
  ctx.closePath();
}

function drawGround(){
  gradients();
  ctx.fillStyle=gGround; ctx.fillRect(0,HORIZON,DW,DH-HORIZON);

  ribbon(ROAD_HALF+0.55); ctx.fillStyle=C.shoulder; ctx.fill();
  ribbon(ROAD_HALF);      ctx.fillStyle=C.road;     ctx.fill();

  drawJunctions();

  /* tar patches, clipped to the road */
  ctx.save();
  ribbon(ROAD_HALF); ctx.clip();
  var phase=S.trackPos%9;
  for(var k=0;k<10;k++){
    var z=2+k*9-phase; if(z<1.4) continue;
    var y=yAt(z), p=ppuAt(z), c=sxAt(0,z,S.px);
    ctx.globalAlpha=.42; ctx.fillStyle=(k%2)?C.roadLite:C.patch;
    ctx.beginPath(); ctx.ellipse(c+Math.sin(k*2.3)*p*.5, y, p*.6, Math.max(2,p*.08),0,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();

  dashes(-0.40); dashes(0.40);
  edge(-ROAD_HALF+0.06); edge(ROAD_HALF-0.06);
}

/* A side street crossing the round, with the tarmac worn pale where the two
   meet. Drawn on the ground, under everything else. */
function drawJunctions(){
  for(var i=0;i<S.junctions.length;i++){
    var j = S.junctions[i];
    var z0 = j.z - S.trackPos - 2.2, z1 = j.z - S.trackPos + 2.2;
    if(z1 < 1.4 || z0 > Z_FAR) continue;
    z0 = Math.max(z0, 1.4);
    var W = 7.5;
    poly([[sxAt(-W,z0,S.px), yAt(z0)], [sxAt(W,z0,S.px), yAt(z0)],
          [sxAt(W,z1,S.px), yAt(z1)], [sxAt(-W,z1,S.px), yAt(z1)]], C.road);
    /* pale wear where traffic turns */
    var zm = (z0+z1)/2, p = ppuAt(zm);
    ctx.globalAlpha=.22; ctx.fillStyle=C.roadLite;
    ctx.beginPath();
    ctx.ellipse(sxAt(0,zm,S.px), yAt(zm), p*2.4, Math.max(2,p*0.5), 0, 0, 6.2832);
    ctx.fill(); ctx.globalAlpha=1;
  }
}

function dashes(xo){
  var phase=S.trackPos%7;
  for(var k=0;k<14;k++){
    var z0=1.8+k*7-phase, z1=z0+3.4;
    if(z1<1.4) continue; if(z0>Z_FAR*0.72) break;
    z0=Math.max(z0,1.4);
    var y0=yAt(z0),y1=yAt(z1),p0=ppuAt(z0),p1=ppuAt(z1);
    var c0=sxAt(xo,z0,S.px), c1=sxAt(xo,z1,S.px);
    var w0=Math.max(.7,p0*.016), w1=Math.max(.4,p1*.016);
    poly([[c0-w0,y0],[c0+w0,y0],[c1+w1,y1],[c1-w1,y1]],'rgba(239,226,173,0.55)');
  }
}

function edge(x){
  ctx.beginPath();
  for(var i=0;i<=SLICES;i++){
    var z=zs[i]; if(z>Z_FAR*0.70) break;
    ctx.lineTo(sxAt(x,z,S.px), yAt(z));
  }
  ctx.strokeStyle='rgba(255,255,255,0.30)';
  ctx.lineWidth=2.2; ctx.lineJoin='round';
  ctx.stroke();
}

/* Warm mist over everything past mid-distance. Painted by scene.js partway
   through the depth-sorted pass, so far scenery emerges from it instead of
   popping in at the draw distance. */
function drawHaze(){
  gradients();
  ctx.fillStyle=gHaze; ctx.fillRect(0,HORIZON-6,DW,102);
}

{ drawSky, drawSkyline, drawGround, drawHaze, hudGradient, hazeGradient,
         invalidateGradients, Z_FAR };

/* ---- render/houses.js ---- */
// The frontage: houses, shops, compound walls, and the pin over a house on the round.

function drawHouse(o, rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  var w=o.w*p, h=o.h*p*(o.storey===2?1.38:1);
  if(cx+w< -60 || cx-w > DW+60) return;
  var x0=cx-w/2, y0=y-h;

  ctx.globalAlpha=.16;
  ctx.beginPath(); ctx.ellipse(cx,y,w*.6,Math.max(2,p*.05),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  var wall = o.target ? o.wall : shade(o.wall,-0.06);
  fillRR(x0,y0,w,h,p*.02,wall);
  ctx.fillStyle='rgba(0,0,0,0.09)';
  ctx.fillRect(o.side>0?x0:x0+w*.74, y0, w*.26, h);

  /* roof slab with a small parapet */
  var rh=Math.max(3,h*.09);
  fillRR(x0-w*.05,y0-rh,w*1.10,rh*1.3,p*.012,o.roof);
  fillRR(x0-w*.02,y0-rh*1.9,w*.10,rh*1.0,p*.01,shade(o.roof,-.08));
  fillRR(x0+w*.92,y0-rh*1.9,w*.10,rh*1.0,p*.01,shade(o.roof,-.08));
  /* water tank on the roof */
  if(o.seed>5){
    fillRR(cx+w*.22, y0-rh*2.6, w*.20, rh*1.6, p*.012, '#2f6ea8');
  }

  if(o.shop){
    /* shuttered shop with a painted board */
    var by0=y-h*.52;
    fillRR(x0+w*.06, y0+h*.10, w*.88, h*.16, p*.01, pick2(o.seed,['#e8b93a','#3f8f6b','#c9553c']));
    ctx.fillStyle='rgba(255,255,255,0.75)';
    for(var q=0;q<4;q++) ctx.fillRect(x0+w*.14+q*w*.19, y0+h*.155, w*.11, Math.max(1.5,h*.022));
    fillRR(x0+w*.10, by0, w*.80, h*.50, p*.01, '#8b949a');
    ctx.fillStyle='rgba(0,0,0,0.12)';
    for(var r2=0;r2<7;r2++) ctx.fillRect(x0+w*.10, by0+r2*h*.07, w*.80, Math.max(1,h*.02));
  } else {
    var wy=y0+h*.22, ww=w*.16, wh=h*.16;
    var win = o.target ? '#a9dcef' : '#a9b7bd';
    fillRR(cx-w*.30,wy,ww,wh,p*.008,win);
    fillRR(cx+w*.14,wy,ww,wh,p*.008,win);
    if(o.storey===2){
      fillRR(cx-w*.30,wy+h*.30,ww,wh,p*.008,win);
      fillRR(cx+w*.14,wy+h*.30,ww,wh,p*.008,win);
      /* balcony rail */
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=Math.max(1,p*.012);
      ctx.beginPath(); ctx.moveTo(cx-w*.36,wy+h*.50); ctx.lineTo(cx+w*.36,wy+h*.50); ctx.stroke();
    }
    fillRR(cx-w*.11, y-h*.30, w*.22, h*.30, p*.012, '#7a5336');
  }

  /* compound wall + gate */
  var bw=w*1.04, bh=h*.24, bx=cx-bw/2, by=y-bh*.62;
  fillRR(bx,by,bw,bh,p*.008, shade(wall,-.16));
  ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fillRect(bx,by,bw,bh*.16);
  var gw=bw*.30, gx=cx-gw/2;
  if(o.target && !o.done){
    fillRR(gx-gw*.14,by,gw*.16,bh,p*.008,'#93a0a8');
    fillRR(gx+gw*.98,by,gw*.16,bh,p*.008,'#93a0a8');
  } else {
    fillRR(gx,by,gw,bh,p*.008,'#93a0a8');
    ctx.fillStyle='rgba(0,0,0,0.16)';
    for(var i=1;i<4;i++) ctx.fillRect(gx+gw*i/4, by, Math.max(.7,p*.006), bh);
  }

  /* delivered paper sitting at the gate */
  if(o.done){
    fillRR(cx-p*.07, y-p*.05, p*.14, p*.07, p*.015, C.paper);
  }

  if(o.target){
    var pulse = .5+.5*Math.sin(S.t*4 + o.seed);
    if(!o.done){
      ctx.strokeStyle='rgba(255,138,21,'+(0.30+0.40*pulse)+')';
      ctx.lineWidth=Math.max(2,p*.022);
      ctx.beginPath();
      ctx.ellipse(cx, y+p*.04, w*.36*(.88+.12*pulse), Math.max(3,p*.06*(.88+.12*pulse)),0,0,6.2832);
      ctx.stroke();
      /* soft glow on the facade */
      ctx.globalAlpha = 0.10+0.10*pulse;
      fillRR(x0,y0,w,h,p*.02,C.pin);
      ctx.globalAlpha = 1;
    }
    drawPin(cx, y0 - rh*2 - p*.26 - Math.sin(S.t*3.4+o.seed)*p*.035, p, o.done);
  }
}

function drawPin(x,y,p,done){
  var s = clamp(p*.34, 16, 54);
  var col = done?C.pinDone:C.pin;
  ctx.beginPath();
  ctx.arc(x, y-s*.62, s*.62, Math.PI*.86, Math.PI*.14);
  ctx.lineTo(x, y+s*.32); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.20)'; ctx.lineWidth=Math.max(1,s*.05); ctx.stroke();
  if(done){
    ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2,s*.14); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x-s*.26,y-s*.62); ctx.lineTo(x-s*.06,y-s*.42); ctx.lineTo(x+s*.28,y-s*.88);
    ctx.stroke(); ctx.lineCap='butt';
  } else {
    fillRR(x-s*.30,y-s*.84,s*.60,s*.42,s*.10,'#fff');
    ctx.fillStyle=col;
    ctx.fillRect(x-s*.20,y-s*.74,s*.40,Math.max(1.5,s*.07));
    ctx.fillRect(x-s*.20,y-s*.60,s*.26,Math.max(1.5,s*.07));
  }
}

/* ---- render/landmarks.js ---- */
// Civic buildings along the round: a temple, a school, a government office.
// None of them are ever on the delivery round — they are there so the street
// has landmarks and the ride stops feeling like one repeating house.

function drawLandmark(o, rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  var w=o.w*p, h=o.h*p;
  if(cx+w < -80 || cx-w > DW+80) return;

  /* ground shadow */
  ctx.globalAlpha=.16;
  ctx.beginPath(); ctx.ellipse(cx,y,w*.55,Math.max(2,p*.05),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  if(o.type==='temple')      temple(o,cx,y,w,h,p);
  else if(o.type==='school') school(o,cx,y,w,h,p);
  else                       govt(o,cx,y,w,h,p);

  /* the low sun catches the east face of everything */
  ctx.globalAlpha=.18;
  ctx.fillStyle=C.warm;
  ctx.fillRect(o.side>0?cx-w/2:cx+w*.14, y-h, w*.36, h);
  ctx.globalAlpha=1;
}

/* ---- temple: plinth, steps, shikhara, kalash, saffron flag ---- */
function temple(o,cx,y,w,h,p){
  var x0=cx-w/2, y0=y-h;

  /* plinth and steps */
  fillRR(x0-w*.10, y-h*.16, w*1.20, h*.16, p*.01, '#d8cbb0');
  ctx.fillStyle='rgba(0,0,0,0.10)';
  for(var s=0;s<3;s++) ctx.fillRect(cx-w*.24+s*w*.02, y-h*.05+s*h*.02, w*.48-s*w*.04, Math.max(1,h*.02));

  /* body */
  fillRR(x0, y0+h*.34, w, h*.50, p*.012, C.temple);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.fillRect(o.side>0?x0:x0+w*.76, y0+h*.34, w*.24, h*.50);

  /* shikhara — the stepped tower */
  var tw=w*.62, tx=cx-tw/2, ty=y0+h*.34;
  for(var i=0;i<5;i++){
    var f=i/5, ww=tw*(1-f*0.62), hh=h*.075;
    fillRR(cx-ww/2, ty-h*.075*(i+1), ww, hh, p*.008, i%2 ? C.temple : '#e6d3b0');
  }
  /* kalash finial */
  var ky = ty-h*.375;
  circle(cx, ky-p*.05, Math.max(2,p*.045), C.templeGold);
  ctx.fillStyle=C.templeGold; ctx.fillRect(cx-Math.max(1,p*.008), ky-p*.14, Math.max(2,p*.016), p*.10);

  /* saffron pennant */
  var flut=Math.sin(S.t*3+o.seed)*p*.03;
  poly([[cx+p*.012,ky-p*.14],[cx+p*.20+flut,ky-p*.10],[cx+p*.012,ky-p*.05]], C.saffron);

  /* doorway and trim band */
  fillRR(cx-w*.12, y-h*.34, w*.24, h*.34, p*.012, C.templeTrim);
  fillRR(cx-w*.08, y-h*.28, w*.16, h*.28, p*.010, '#5a3524');
  ctx.fillStyle=C.templeTrim;
  ctx.fillRect(x0, y0+h*.34, w, Math.max(1.5,h*.035));

  /* bell hanging in the porch */
  var bx=cx-w*.30, by=y-h*.46;
  ctx.strokeStyle='#8d8577'; ctx.lineWidth=Math.max(1,p*.008);
  ctx.beginPath(); ctx.moveTo(bx,by-p*.10); ctx.lineTo(bx,by); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx,by,Math.max(2,p*.05),Math.PI,0); ctx.fillStyle=C.templeGold; ctx.fill();
}

/* ---- school: long block, tricolour on a pole, painted board, boundary wall ---- */
function school(o,cx,y,w,h,p){
  var x0=cx-w/2, y0=y-h;

  fillRR(x0, y0, w, h, p*.012, C.school);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.fillRect(o.side>0?x0:x0+w*.80, y0, w*.20, h);

  /* flat roof with a parapet */
  fillRR(x0-w*.03, y0-h*.07, w*1.06, h*.08, p*.008, C.schoolTrim);

  /* a row of classroom windows */
  var n=6, wy=y0+h*.26, ww=w*.10, wh=h*.24;
  for(var i=0;i<n;i++){
    var wx = x0 + w*.08 + i*(w*.84/n);
    fillRR(wx, wy, ww, wh, p*.006, '#a9c4d0');
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=Math.max(1,p*.006);
    ctx.beginPath(); ctx.moveTo(wx+ww/2,wy); ctx.lineTo(wx+ww/2,wy+wh); ctx.stroke();
  }

  /* verandah posts */
  ctx.fillStyle='#d8cdb4';
  for(var q=0;q<4;q++) ctx.fillRect(x0+w*.10+q*w*.26, y-h*.28, Math.max(1.5,w*.022), h*.28);

  /* painted name board */
  fillRR(x0+w*.20, y0+h*.60, w*.60, h*.14, p*.008, C.schoolTrim);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillRect(x0+w*.25, y0+h*.645, w*.50, Math.max(1.5,h*.030));

  /* flagpole with the tricolour */
  var fx = cx + w*.40*(o.side>0?-1:1), fh=h*1.05;
  ctx.fillStyle='#b9b2a4'; ctx.fillRect(fx-Math.max(1,p*.008), y-fh, Math.max(2,p*.016), fh);
  var fw=p*.30, fhh=p*.20, wave=Math.sin(S.t*2.6+o.seed)*p*.02;
  fillRR(fx, y-fh, fw, fhh/3, 0, C.saffron);
  fillRR(fx, y-fh+fhh/3+wave*0, fw, fhh/3, 0, '#ffffff');
  fillRR(fx, y-fh+fhh*2/3, fw, fhh/3, 0, C.green);
  circle(fx+fw*.5, y-fh+fhh*.5, Math.max(1,fhh*.10), C.chakra);

  /* boundary wall and gate */
  fillRR(cx-w*.56, y-h*.18, w*1.12, h*.18, p*.006, '#ddd2ba');
  ctx.fillStyle='rgba(0,0,0,0.14)';
  for(var g=0;g<5;g++) ctx.fillRect(cx-w*.14+g*w*.07, y-h*.18, Math.max(.8,p*.006), h*.18);
}

/* ---- government office: plain sarkari block, tricolour band, board ---- */
function govt(o,cx,y,w,h,p){
  var x0=cx-w/2, y0=y-h;

  fillRR(x0, y0, w, h, p*.008, C.govt);
  ctx.fillStyle='rgba(0,0,0,0.09)';
  ctx.fillRect(o.side>0?x0:x0+w*.78, y0, w*.22, h);

  /* deep roof slab */
  fillRR(x0-w*.05, y0-h*.09, w*1.10, h*.10, p*.006, '#c4bba6');

  /* two storeys of identical windows, because it is a government office */
  for(var row=0; row<2; row++){
    for(var i=0;i<5;i++){
      var wx = x0 + w*.09 + i*(w*.82/5), wy = y0 + h*(0.20 + row*0.34);
      fillRR(wx, wy, w*.09, h*.20, p*.005, '#9fb3bc');
      ctx.fillStyle='rgba(255,255,255,0.30)';
      ctx.fillRect(wx, wy, w*.09, Math.max(1,h*.03));
    }
  }

  /* tricolour band over the entrance */
  var bw=w*.52, bx=cx-bw/2, by=y0+h*.80;
  fillRR(bx, by, bw, h*.035, 0, C.saffron);
  fillRR(bx, by+h*.035, bw, h*.035, 0, '#ffffff');
  fillRR(bx, by+h*.070, bw, h*.035, 0, C.green);

  /* board and doorway */
  fillRR(bx, y0+h*.62, bw, h*.13, p*.006, C.govtTrim);
  ctx.fillStyle='rgba(255,255,255,0.80)';
  ctx.fillRect(bx+bw*.08, y0+h*.665, bw*.84, Math.max(1.5,h*.028));
  fillRR(cx-w*.10, y-h*.30, w*.20, h*.30, p*.008, '#6d5a44');

  /* a couple of parked cycles and a notice board */
  circle(cx-w*.34, y-p*.05, p*.055, '#3a3a3a');
  circle(cx-w*.26, y-p*.05, p*.055, '#3a3a3a');
  fillRR(cx+w*.28, y-h*.22, w*.12, h*.16, p*.006, '#8d8577');
}

/* ---- render/props.js ---- */
// Verge dressing: poles, trees, hoardings, hand pumps, chai stalls, dogs, bunting.

function drawProp(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  if(cx < -80 || cx > DW+80) return;

  if(o.type==='pole'){
    var h=2.4*p;
    ctx.fillStyle='#8d8577';
    ctx.fillRect(cx-Math.max(1,p*.016), y-h, Math.max(2,p*.032), h);
    ctx.fillRect(cx-p*.11, y-h, p*.22, Math.max(1.5,p*.018));
    /* drooping wire */
    ctx.strokeStyle='rgba(40,40,40,0.5)'; ctx.lineWidth=Math.max(1,p*.008);
    ctx.beginPath(); ctx.moveTo(cx, y-h+p*.02);
    ctx.quadraticCurveTo(cx - o.x*p*0.9, y-h+p*.30, cx - o.x*p*1.9, y-h+p*.04);
    ctx.stroke();
    return;
  }
  if(o.type==='tree'){
    var th=1.2*p;
    ctx.fillStyle='#7d5b3a';
    ctx.fillRect(cx-Math.max(1,p*.022), y-th, Math.max(2,p*.044), th);
    var sway=Math.sin(S.t*1.4+o.seed)*p*.02;
    circle(cx+sway, y-th-p*.36, p*.46,'#5f8f43');
    circle(cx-p*.30+sway, y-th-p*.18, p*.32,'#6ea04d');
    circle(cx+p*.28+sway, y-th-p*.20, p*.30,'#4f7d38');
    circle(cx+sway, y-th-p*.62, p*.30,'#6ea04d');
    return;
  }
  if(o.type==='hoarding'){
    var hw=1.5*p, hh=0.8*p, hy=y-1.9*p;
    ctx.fillStyle='#7b7268';
    ctx.fillRect(cx-p*.03, hy+hh, p*.06, 1.1*p);
    fillRR(cx-hw/2, hy, hw, hh, p*.02, '#f0e6d2');
    var band = pick2(o.seed,['#d24d3e','#2f7fbf','#2f8f5f']);
    fillRR(cx-hw/2, hy, hw, hh*.34, p*.02, band);
    ctx.fillStyle='rgba(0,0,0,0.30)';
    ctx.fillRect(cx-hw*.38, hy+hh*.52, hw*.72, Math.max(2,hh*.10));
    ctx.fillRect(cx-hw*.38, hy+hh*.72, hw*.48, Math.max(2,hh*.09));
    return;
  }
  if(o.type==='handpump'){
    ctx.fillStyle='#5f6a72';
    ctx.fillRect(cx-p*.02, y-p*.5, p*.04, p*.5);
    ctx.fillRect(cx-p*.02, y-p*.52, p*.16, p*.05);
    fillRR(cx-p*.14, y-p*.08, p*.28, p*.08, p*.01, '#8d8577');
    return;
  }
  if(o.type==='chai'){
    var sw=1.0*p, sh=0.66*p, sy=y-sh;
    /* counter */
    fillRR(cx-sw/2, sy+sh*.42, sw, sh*.58, p*.015, '#a9713e');
    /* awning */
    poly([[cx-sw*.62,sy+sh*.42],[cx+sw*.62,sy+sh*.42],[cx+sw*.5,sy],[cx-sw*.5,sy]], '#2f7fbf');
    ctx.fillStyle='rgba(255,255,255,0.55)';
    for(var i=0;i<4;i++) ctx.fillRect(cx-sw*.5+i*sw*.26, sy, sw*.13, sh*.42);
    /* kettle + steam */
    circle(cx-sw*.18, sy+sh*.36, p*.07, '#6f7a80');
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=Math.max(1,p*.012);
    var st=(S.t*1.6+o.seed)%1;
    ctx.beginPath();
    ctx.moveTo(cx-sw*.18, sy+sh*.28);
    ctx.quadraticCurveTo(cx-sw*.10, sy+sh*.10-st*p*.2, cx-sw*.18, sy-st*p*.3);
    ctx.stroke();
    /* stools */
    circle(cx+sw*.30, y-p*.06, p*.06, '#6b5540');
    return;
  }
  if(o.type==='hawker'){
    drawHawker(o,cx,y,p);
    return;
  }
  if(o.type==='dog'){
    var trot = Math.sin(S.t*6+o.seed);
    var dw=0.42*p, dh=0.26*p, dy=y-dh;
    fillRR(cx-dw/2, dy, dw, dh*.72, p*.03, '#c99a63');
    fillRR(cx+dw*.26, dy-dh*.42, dw*.30, dh*.46, p*.02, '#c99a63');
    ctx.fillStyle='#b1834f';
    ctx.fillRect(cx-dw*.36, dy+dh*.6, dw*.12, dh*.42+trot*p*.01);
    ctx.fillRect(cx+dw*.20, dy+dh*.6, dw*.12, dh*.42-trot*p*.01);
    ctx.strokeStyle='#c99a63'; ctx.lineWidth=Math.max(1.5,p*.02); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx-dw*.48, dy+dh*.15);
    ctx.quadraticCurveTo(cx-dw*.70, dy-dh*.2-trot*p*.03, cx-dw*.62, dy-dh*.5);
    ctx.stroke(); ctx.lineCap='butt';
    return;
  }
}

/* ---- hawkers ---------------------------------------------------------------
   The street is already awake: a sabziwala behind his cart, a fruit seller
   with a head-load basket, the milkman with his cans, and someone selling
   brooms. They sway and call out; none of them are in the road. */
function drawHawker(o,cx,y,p){
  var sway = Math.sin(S.t*1.8+o.seed)*p*.012;
  var face = o.x>0 ? -1 : 1;                 // they face the road
  var kurta = pick2(o.seed, ['#dcd3c0','#cfe0ea','#e6d2c2','#d4e0cf','#efe3c8']);
  var hh = 0.92*p;                           // person height in pixels

  if(o.hawker==='sabzi'){
    /* handcart of vegetables */
    var cw=p*.66, ch=p*.24, cy=y-ch-p*.08;
    circle(cx-cw*.30, y-p*.07, p*.075, '#3a3a3a');
    circle(cx+cw*.30, y-p*.07, p*.075, '#3a3a3a');
    fillRR(cx-cw/2, cy, cw, ch, p*.02, '#a9713e');
    var veg=['#4f8f3a','#e2483d','#6cbf46','#f0a92a','#8e5fb0','#4f8f3a'];
    for(var i=0;i<6;i++) circle(cx-cw*.36+i*cw*.145, cy-p*.03, p*.045, veg[i]);
    person(cx-cw*.62, y, hh, kurta, face, sway, o.seed);
    return;
  }
  if(o.hawker==='fruit'){
    /* basket carried on the head */
    person(cx, y, hh, kurta, face, sway, o.seed);
    var by=y-hh-p*.05;
    fillRR(cx-p*.17+sway, by-p*.09, p*.34, p*.10, p*.02, '#c8a262');
    circle(cx-p*.08+sway, by-p*.11, p*.045, '#f0a92a');
    circle(cx+p*.02+sway, by-p*.12, p*.045, '#e2483d');
    circle(cx+p*.10+sway, by-p*.10, p*.040, '#6cbf46');
    return;
  }
  if(o.hawker==='milk'){
    /* cycle with milk cans slung either side */
    var wr=p*.10;
    circle(cx-p*.24, y-wr, wr, '#2b2b2b');
    circle(cx+p*.24, y-wr, wr, '#2b2b2b');
    ctx.strokeStyle='#5a6b7a'; ctx.lineWidth=Math.max(1.5,p*.018);
    ctx.beginPath();
    ctx.moveTo(cx-p*.24,y-wr); ctx.lineTo(cx,y-p*.30); ctx.lineTo(cx+p*.24,y-wr);
    ctx.moveTo(cx,y-p*.30); ctx.lineTo(cx-p*.04,y-p*.52);
    ctx.stroke();
    fillRR(cx-p*.30, y-p*.34, p*.15, p*.22, p*.02, '#b9c3c8');
    fillRR(cx+p*.16, y-p*.34, p*.15, p*.22, p*.02, '#b9c3c8');
    person(cx-p*.02, y, hh*.92, kurta, face, sway, o.seed);
    return;
  }
  /* broom seller: a bundle over the shoulder */
  person(cx, y, hh, kurta, face, sway, o.seed);
  ctx.strokeStyle='#b08040'; ctx.lineWidth=Math.max(1.5,p*.016);
  ctx.beginPath();
  ctx.moveTo(cx-p*.20+sway, y-hh*.52); ctx.lineTo(cx+p*.24+sway, y-hh*.86);
  ctx.stroke();
  ctx.strokeStyle='#d8c489'; ctx.lineWidth=Math.max(1,p*.010);
  for(var b=0;b<5;b++){
    ctx.beginPath();
    ctx.moveTo(cx+p*.22+sway, y-hh*.84);
    ctx.lineTo(cx+p*.34+sway+b*p*.012, y-hh*.96-b*p*.008);
    ctx.stroke();
  }
}

/* A single flat-vector figure — head, torso, legs. Deliberately simple: at
   this scale anything more reads as noise. */
function person(x, ground, h, kurta, face, sway, seed){
  var skin='#c98a5e';
  /* legs */
  ctx.fillStyle='#6f7a86';
  ctx.fillRect(x-h*.10, ground-h*.42, h*.08, h*.42);
  ctx.fillRect(x+h*.02, ground-h*.42, h*.08, h*.42);
  /* torso */
  fillRR(x-h*.15+sway, ground-h*.80, h*.30, h*.42, h*.06, kurta);
  /* arm nearest the road */
  ctx.strokeStyle=skin; ctx.lineWidth=Math.max(1.5,h*.07); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x+face*h*.12+sway, ground-h*.72);
  ctx.lineTo(x+face*h*.22+sway, ground-h*.50+Math.sin(seed+ground*0.01)*h*.03);
  ctx.stroke(); ctx.lineCap='butt';
  /* head */
  circle(x+sway, ground-h*.90, h*.11, skin);
  ctx.fillStyle='#2a2320';
  ctx.beginPath(); ctx.arc(x+sway, ground-h*.93, h*.11, Math.PI, 0); ctx.fill();
}

/* bunting strung across the street */
function drawBunting(o,rel){
  var p=ppuAt(rel);
  var yTop = yAt(rel) - 2.6*p;
  var xl = sxAt(-2.0, rel, S.px), xr = sxAt(2.0, rel, S.px);
  var sag = p*0.55 + Math.sin(S.t*1.2+o.seed)*p*0.05;
  ctx.strokeStyle='rgba(60,50,40,0.55)'; ctx.lineWidth=Math.max(1,p*.008);
  ctx.beginPath(); ctx.moveTo(xl,yTop); ctx.quadraticCurveTo((xl+xr)/2, yTop+sag, xr, yTop); ctx.stroke();
  var cols=[C.saffron,'#ffffff',C.green,'#2f7fbf','#d24d3e'];
  var n=11;
  for(var i=1;i<n;i++){
    var t=i/n;
    var bx=(1-t)*(1-t)*xl + 2*(1-t)*t*((xl+xr)/2) + t*t*xr;
    var by=(1-t)*(1-t)*yTop + 2*(1-t)*t*(yTop+sag) + t*t*yTop;
    var fs=Math.max(3,p*.07);
    poly([[bx-fs*.5,by],[bx+fs*.5,by],[bx,by+fs*1.3]], cols[i%cols.length]);
  }
}

/* ---- render/obstacles.js ---- */
// Things in the road: cows, autos, thelas, potholes, scooters, tempos.

function drawObstacle(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px), s=p;

  if(o.type!=='pothole'){
    ctx.globalAlpha=.22;
    ctx.beginPath(); ctx.ellipse(cx,y,s*.34,Math.max(1.5,s*.07),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
    ctx.globalAlpha=1;
  }

  if(o.type==='pothole'){
    ctx.beginPath(); ctx.ellipse(cx,y,s*.34,Math.max(2,s*.11),0,0,6.2832); ctx.fillStyle='#41403a'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,y-s*.02,s*.26,Math.max(1.5,s*.075),0,0,6.2832); ctx.fillStyle='#2a2925'; ctx.fill();
    ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.ellipse(cx-s*.06,y+s*.01,s*.12,Math.max(1,s*.03),0,0,6.2832); ctx.fillStyle='#6f8fa0'; ctx.fill();
    ctx.globalAlpha=1;
    return;
  }

  if(o.type==='cow'){
    var chew = Math.sin(S.t*3+o.seed)*s*.012;
    var bh=s*.62, bw=s*.54;
    fillRR(cx-bw/2, y-bh, bw, bh*.70, s*.07, '#f4eee2');
    ctx.fillStyle='#7a5b41';
    ctx.beginPath(); ctx.ellipse(cx-bw*.16,y-bh*.60,bw*.17,bh*.15,0,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+bw*.20,y-bh*.38,bw*.14,bh*.13,0,0,6.2832); ctx.fill();
    ctx.fillStyle='#ddd6c8';
    ctx.fillRect(cx-bw*.36,y-bh*.30,bw*.15,bh*.30);
    ctx.fillRect(cx+bw*.21,y-bh*.30,bw*.15,bh*.30);
    /* hump */
    ctx.beginPath(); ctx.arc(cx, y-bh*.72, bw*.20, Math.PI, 0); ctx.fillStyle='#f4eee2'; ctx.fill();
    /* head */
    fillRR(cx-bw*.23, y-bh*1.20+chew, bw*.46, bh*.48, s*.05, '#f8f3e9');
    fillRR(cx-bw*.12, y-bh*.88+chew, bw*.24, bh*.17, s*.04, '#e3c2bb');
    ctx.strokeStyle='#cbb79a'; ctx.lineWidth=Math.max(1.6,s*.032); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx-bw*.19,y-bh*1.18+chew); ctx.quadraticCurveTo(cx-bw*.36,y-bh*1.38+chew,cx-bw*.27,y-bh*1.47+chew);
    ctx.moveTo(cx+bw*.19,y-bh*1.18+chew); ctx.quadraticCurveTo(cx+bw*.36,y-bh*1.38+chew,cx+bw*.27,y-bh*1.47+chew);
    ctx.stroke(); ctx.lineCap='butt';
    circle(cx-bw*.11,y-bh*1.03+chew,Math.max(1,s*.022),C.ink);
    circle(cx+bw*.11,y-bh*1.03+chew,Math.max(1,s*.022),C.ink);
    return;
  }

  if(o.type==='auto'){
    var aw=s*.62, ah=s*.70;
    ctx.beginPath();
    ctx.moveTo(cx-aw/2,y-ah*.56); ctx.quadraticCurveTo(cx,y-ah*1.10,cx+aw/2,y-ah*.56);
    ctx.closePath(); ctx.fillStyle='#1f6f4f'; ctx.fill();
    fillRR(cx-aw/2,y-ah*.58,aw,ah*.44,s*.04,'#f3c51e');
    fillRR(cx-aw*.30,y-ah*.54,aw*.60,ah*.22,s*.03,'#2c3b44');
    fillRR(cx-aw*.42,y-ah*.18,aw*.84,ah*.10,s*.02,'#2c2c2c');
    fillRR(cx-aw*.17,y-ah*.35,aw*.34,ah*.12,s*.02,C.paper);
    circle(cx-aw*.36,y-ah*.08,s*.075,'#25272b');
    circle(cx+aw*.36,y-ah*.08,s*.075,'#25272b');
    return;
  }

  if(o.type==='thela'){
    var cw=s*.72, ch=s*.38;
    circle(cx-cw*.28,y-ch*.16,s*.10,'#3a3a3a');
    circle(cx+cw*.28,y-ch*.16,s*.10,'#3a3a3a');
    fillRR(cx-cw/2,y-ch-s*.10,cw,ch,s*.03,'#b5793f');
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(cx-cw/2,y-ch*.44-s*.10,cw,ch*.12);
    var cols=['#e2483d','#f6a723','#6cbf46','#e2483d','#f6a723','#8e5fb0'];
    for(var i=0;i<6;i++) circle(cx-cw*.36+i*cw*.145, y-ch-s*.17, s*.06, cols[i]);
    /* umbrella */
    ctx.fillStyle='#7b7268'; ctx.fillRect(cx+cw*.30, y-ch-s*.72, s*.02, s*.6);
    ctx.beginPath(); ctx.arc(cx+cw*.31, y-ch-s*.70, s*.26, Math.PI, 0);
    ctx.fillStyle='#d24d3e'; ctx.fill();
    return;
  }

  if(o.type==='scooter'){
    var sw=s*.40, sh=s*.48;
    circle(cx-sw*.42,y-s*.075,s*.08,'#2b2b2b');
    circle(cx+sw*.42,y-s*.075,s*.08,'#2b2b2b');
    fillRR(cx-sw*.5,y-sh*.62,sw,sh*.36,s*.04,'#3f79b8');
    fillRR(cx-sw*.16,y-sh*.98,sw*.44,sh*.38,s*.03,'#2f5f95');
    ctx.fillStyle='#2b2b2b'; ctx.fillRect(cx-sw*.5,y-sh*1.04,sw*.11,sh*.44);
    return;
  }

  /* tempo / Horn OK truck coming the other way */
  var tw=s*.86, th=s*1.0;
  fillRR(cx-tw/2,y-th,tw,th*.60,s*.05,'#2f6db5');
  fillRR(cx-tw*.46,y-th*1.18,tw*.92,th*.24,s*.04,'#e94f37');
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillRect(cx-tw*.30,y-th*1.10,tw*.60,Math.max(2,th*.05));
  fillRR(cx-tw*.34,y-th*.92,tw*.68,th*.26,s*.03,'#cfe4ef');
  fillRR(cx-tw*.40,y-th*.44,tw*.80,th*.16,s*.02,'#20344f');
  fillRR(cx-tw/2,y-th*.26,tw,th*.13,s*.02,'#e9c84f');
  circle(cx-tw*.34,y-th*.34,s*.05,'#fff3c4');
  circle(cx+tw*.34,y-th*.34,s*.05,'#fff3c4');
  circle(cx-tw*.38,y-th*.10,s*.095,'#25272b');
  circle(cx+tw*.38,y-th*.10,s*.095,'#25272b');
  return;
}

/* ---- render/crossings.js ---- */
// Hazards that move into your lane.
//
// The telegraph is the whole design (claude.md section 4.2): the dog waits on
// the verge, then freezes with its ears up and a marker over it for a beat,
// and only then bolts. If you can be hit without warning, the hazard is a bug.

function drawCrossing(o, rel){
  if(o.phase==='gone') return;
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);

  /* shadow */
  ctx.globalAlpha=.22;
  ctx.beginPath(); ctx.ellipse(cx,y,p*.22,Math.max(1.5,p*.05),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  var alert = (o.phase==='alert');
  var running = (o.phase==='run');
  dog(o, cx, y, p, alert, running);

  /* the tell: a pulsing warning over the dog while it is about to bolt */
  if(alert){
    var pulse = .5+.5*Math.sin(S.t*14);
    var wy = y - p*.62;
    ctx.globalAlpha = 0.55+0.45*pulse;
    poly([[cx, wy-p*.22],[cx+p*.17, wy+p*.06],[cx-p*.17, wy+p*.06]], C.bad);
    ctx.globalAlpha = 1;
    ctx.fillStyle='#fff';
    ctx.fillRect(cx-Math.max(1,p*.014), wy-p*.13, Math.max(2,p*.028), p*.11);
    ctx.fillRect(cx-Math.max(1,p*.014), wy+p*.005, Math.max(2,p*.028), Math.max(1.5,p*.024));
    /* a low arc showing which way it is about to go */
    ctx.strokeStyle='rgba(232,80,58,'+(0.35+0.35*pulse)+')';
    ctx.lineWidth=Math.max(1.5,p*.018);
    ctx.beginPath();
    ctx.moveTo(cx, y+p*.02);
    ctx.lineTo(cx - o.from*p*.55, y+p*.02);
    ctx.stroke();
  }
}

function dog(o, cx, y, p, alert, running){
  var trot = running ? Math.sin(S.t*22+o.seed) : Math.sin(S.t*5+o.seed)*0.4;
  var dw=0.46*p, dh=0.28*p, dy=y-dh;
  var facing = running ? (o.x1>o.x0 ? 1 : -1) : -Math.sign(o.x || 1);

  /* body */
  fillRR(cx-dw/2, dy, dw, dh*.72, p*.03, '#c99a63');
  /* haunches */
  fillRR(cx-facing*dw*.34, dy+dh*.04, dw*.30, dh*.60, p*.025, '#bf8e58');
  /* head */
  fillRR(cx+facing*dw*.26, dy-dh*.44, dw*.30, dh*.48, p*.02, '#c99a63');
  /* snout */
  fillRR(cx+facing*dw*.46, dy-dh*.22, dw*.16, dh*.16, p*.015, '#b1834f');

  /* ears — flat when dozing, up when it has seen you */
  ctx.fillStyle='#a87a48';
  var ex = cx+facing*dw*.30, ey = dy-dh*.44;
  if(alert || running){
    poly([[ex, ey],[ex-facing*p*.02, ey-p*.11],[ex+facing*p*.06, ey-p*.02]], '#a87a48');
    poly([[ex+facing*p*.10, ey],[ex+facing*p*.10, ey-p*.10],[ex+facing*p*.16, ey-p*.01]], '#a87a48');
  } else {
    fillRR(ex-p*.01, ey+p*.01, p*.08, p*.035, p*.01, '#a87a48');
  }

  /* legs */
  ctx.fillStyle='#b1834f';
  var lift = running ? p*.05 : p*.012;
  ctx.fillRect(cx-dw*.36, dy+dh*.60, dw*.11, dh*.46+trot*lift);
  ctx.fillRect(cx-dw*.18, dy+dh*.60, dw*.11, dh*.46-trot*lift);
  ctx.fillRect(cx+dw*.10, dy+dh*.60, dw*.11, dh*.46-trot*lift);
  ctx.fillRect(cx+dw*.26, dy+dh*.60, dw*.11, dh*.46+trot*lift);

  /* tail */
  ctx.strokeStyle='#c99a63'; ctx.lineWidth=Math.max(1.5,p*.022); ctx.lineCap='round';
  var tw = running ? Math.sin(S.t*26+o.seed)*p*.05 : Math.sin(S.t*3+o.seed)*p*.03;
  ctx.beginPath();
  ctx.moveTo(cx-facing*dw*.48, dy+dh*.16);
  ctx.quadraticCurveTo(cx-facing*dw*.70, dy-dh*.20+tw, cx-facing*dw*.62, dy-dh*.52);
  ctx.stroke(); ctx.lineCap='butt';

  /* eye */
  circle(cx+facing*dw*.40, dy-dh*.30, Math.max(1,p*.018), C.ink);

  /* speed streaks while it is crossing */
  if(running){
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=Math.max(1,p*.012);
    for(var i=0;i<3;i++){
      var sy2 = dy+dh*(0.1+i*0.28);
      ctx.beginPath();
      ctx.moveTo(cx-facing*(dw*.55+p*.06), sy2);
      ctx.lineTo(cx-facing*(dw*.55+p*.24+i*p*.04), sy2);
      ctx.stroke();
    }
  }
}

/* ---- render/effects.js ---- */
// Paper bundles on the road, dust puffs, and a paper in flight.

function drawPickup(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  var bob=Math.sin(S.t*4+o.z)*p*.04;
  var w=p*.30,h=p*.22;
  ctx.globalAlpha=.2;
  ctx.beginPath(); ctx.ellipse(cx,y,w*.7,Math.max(1.5,p*.04),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;
  var yy=y-h-p*.10+bob;
  fillRR(cx-w/2,yy,w,h,p*.02,C.paper);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.fillRect(cx-w/2,yy+h*.36,w,h*.10); ctx.fillRect(cx-w/2,yy+h*.64,w,h*.10);
  ctx.fillStyle=C.paperInk; ctx.fillRect(cx-w*.30,yy+h*.14,w*.60,Math.max(1,h*.11));
  ctx.strokeStyle='#c6a86f'; ctx.lineWidth=Math.max(1,p*.012);
  ctx.beginPath(); ctx.moveTo(cx,yy); ctx.lineTo(cx,yy+h); ctx.stroke();
}
function drawDust(d){
  var rel = d.z - S.trackPos;
  if(rel<1.2 || rel>40) return;
  var p=ppuAt(rel);
  ctx.globalAlpha = clamp(d.t,0,1)*0.42;
  circle(sxAt(d.x,rel,S.px), yAt(rel) - (1-d.t)*p*0.16,
         Math.min(46, d.r*(0.6+(1-d.t)*0.8)*p), '#e5d6b4');
  ctx.globalAlpha=1;
}
function drawShot(s){
  /* start at the rider's hand, end where the paper actually lands */
  var relEnd = Math.max(1.4, s.landZ - S.trackPos);
  var pEnd = ppuAt(relEnd);
  var ex = sxAt(s.landX, relEnd, S.px);
  var ey = yAt(relEnd) - pEnd*0.06;
  var sx0 = DW/2 + s.side*104, sy0 = DH-190;
  var t = s.t;
  var x = sx0 + (ex-sx0)*t;
  var y = sy0 + (ey-sy0)*t - Math.sin(t*Math.PI)*82;
  var size = 44*(1-t) + Math.max(12, pEnd*0.17)*t;

  /* motion trail */
  ctx.globalAlpha=0.22;
  for(var k=1;k<=3;k++){
    var tt=Math.max(0,t-k*0.05);
    var tx2=sx0+(ex-sx0)*tt, ty2=sy0+(ey-sy0)*tt-Math.sin(tt*Math.PI)*82;
    circle(tx2,ty2,size*0.30,C.paper);
  }
  ctx.globalAlpha=1;

  ctx.save(); ctx.translate(x,y); ctx.rotate(s.spin*s.side);
  fillRR(-size*.5,-size*.30,size,size*.60,size*.14,C.paper);
  ctx.fillStyle=C.paperInk; ctx.fillRect(-size*.30,-size*.14,size*.60,Math.max(1.5,size*.10));
  ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.fillRect(-size*.30,size*.06,size*.40,Math.max(1,size*.07));
  ctx.restore();
}

/* ---- render/rider.js ---- */
// The rider, drawn from behind: bike, basket, handlebar, mirrors and arms.

/* How much of the screen the scooter is allowed to take. claude.md section 3
   wants the basket under a quarter of the visible height; at 0.80 the whole
   assembly tops out around 165px of 700, which also makes the view read as
   what it is — first person, over the handlebar. */
var RIDER_K = 0.80;

function drawRider(){
  var lean=clamp(S.lean,-.9,.9);
  var wob=Math.sin(S.t*10)*1.2 + (S.stun>0?Math.sin(S.t*40)*7:0);
  ctx.save();
  ctx.translate(DW/2 + lean*34 + wob, DH);
  ctx.rotate(lean*0.05);
  ctx.scale(RIDER_K, RIDER_K);

  ctx.globalAlpha=.22;
  ctx.beginPath(); ctx.ellipse(0,-4,124,22,0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  /* tank */
  ctx.beginPath();
  ctx.moveTo(-108,4); ctx.quadraticCurveTo(-94,-86,0,-106); ctx.quadraticCurveTo(94,-86,108,4);
  ctx.closePath(); ctx.fillStyle='#2c4258'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-76,4); ctx.quadraticCurveTo(-68,-74,0,-92); ctx.quadraticCurveTo(68,-74,76,4);
  ctx.closePath(); ctx.fillStyle='#3d5f7e'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-16,4); ctx.quadraticCurveTo(-10,-72,0,-90); ctx.quadraticCurveTo(10,-72,16,4);
  ctx.closePath(); ctx.fillStyle='#e8ebee'; ctx.fill();
  circle(0,-78,9,'#22303d'); circle(0,-78,5,'#8fa3b3');

  /* basket of papers */
  var bw=132, bh=50, by=-188;
  var stack = clamp(Math.ceil(S.papers/3),0,6);
  for(var i=0;i<stack;i++){
    var spread = stack>1 ? (bw*0.66/(stack-1)) : 0;
    ctx.save();
    ctx.translate(-bw*0.33 + i*spread, by+16-(i%2)*6);
    ctx.rotate(i%2?0.12:-0.10);
    fillRR(-18,-13,36,26,8, i%2?'#efe9d8':C.paper);
    ctx.fillStyle=C.paperInk; ctx.fillRect(-11,-6,22,3);
    ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.fillRect(-11,1,15,3);
    ctx.restore();
  }
  ctx.strokeStyle='#3a4048'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-bw/2,by); ctx.lineTo(-bw*.40,by+bh);
  ctx.lineTo(bw*.40,by+bh); ctx.lineTo(bw/2,by); ctx.stroke();
  ctx.lineWidth=3;
  for(var k=1;k<6;k++){ var fx=-bw/2+k*(bw/6);
    ctx.beginPath(); ctx.moveTo(fx,by); ctx.lineTo(fx*.80,by+bh); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-bw*.455,by+bh*.5); ctx.lineTo(bw*.455,by+bh*.5); ctx.stroke();
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-bw*.40,by+bh); ctx.lineTo(bw*.40,by+bh); ctx.stroke();

  /* handlebar */
  ctx.strokeStyle='#242a31'; ctx.lineWidth=12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-128,-106); ctx.quadraticCurveTo(0,-148,128,-106); ctx.stroke();
  ctx.lineWidth=18; ctx.strokeStyle='#15181c';
  ctx.beginPath(); ctx.moveTo(-134,-104); ctx.lineTo(-106,-112); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(134,-104); ctx.lineTo(106,-112); ctx.stroke();
  ctx.lineCap='butt';

  mirror(-152,-182,-1); mirror(152,-182,1);

  /* hands — the throwing one lifts off the grip and swings out */
  var throwT = S.arm>0 ? 1 - (S.arm/0.34) : 0;
  drawArm(-1, S.arm>0 && S.armSide===-1 ? throwT : 0);
  drawArm( 1, S.arm>0 && S.armSide=== 1 ? throwT : 0);

  ctx.restore();
}
function drawArm(side, t){
  /* t: 0 resting on the grip, 1 full follow-through */
  var swing = Math.sin(t*Math.PI);
  var gx = side*120, gy = -110;
  var x = gx + side*swing*58;
  var y = gy - swing*66;
  var shx = side*74, shy = 34;                    // shoulder, just off the bottom edge
  /* upper arm + forearm as one tapered limb */
  ctx.strokeStyle='#42607d'; ctx.lineWidth=27; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(shx, shy);
  ctx.quadraticCurveTo(shx + side*26, (shy+y)/2 + 18 - swing*20, x, y+10);
  ctx.stroke();
  /* cuff */
  ctx.strokeStyle='#33506b'; ctx.lineWidth=27;
  ctx.beginPath();
  ctx.moveTo(x - side*4, y+22); ctx.lineTo(x, y+12); ctx.stroke();
  ctx.lineCap='butt';
  /* fist */
  ctx.save(); ctx.translate(x,y); ctx.rotate(side*(0.12+swing*0.7));
  fillRR(-22,-17,44,31,13,'#c98a5e');
  ctx.fillStyle='rgba(0,0,0,0.10)'; ctx.fillRect(-22,-3,44,5);
  ctx.restore();
}
function mirror(x,y,dir){
  ctx.strokeStyle='#242a31'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-dir*16,y+72); ctx.lineTo(x,y+18); ctx.stroke();
  ctx.lineCap='butt';
  ctx.save(); ctx.translate(x,y); ctx.rotate(dir*.20);
  fillRR(-19,-15,38,30,9,'#242a31');
  fillRR(-14,-10,28,20,6,'#9dc2d4');
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.moveTo(-14,4); ctx.lineTo(2,-10); ctx.lineTo(10,-10); ctx.lineTo(-8,8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---- render/hud.js ---- */
// Score, lives, paper count, progress, and the two throw-timing gauges.

function drawHUD(){
  ctx.fillStyle=hudGradient(); ctx.fillRect(0,0,DW,96);

  label('LEVEL '+S.level,16,30,15,C.hudDim,'left','700');
  label(String(S.score),16,58,26,C.hud,'left','800');
  label('DELIVERED',DW-16,30,13,C.hudDim,'right','700');
  label(S.delivered+' / '+S.need,DW-16,58,26,S.delivered>=S.need?C.good:C.hud,'right','800');

  for(var i=0;i<S.lives;i++){
    var hx=DW-24-i*24, hy=80;
    ctx.beginPath(); ctx.arc(hx,hy,10,Math.PI,0);
    ctx.lineTo(hx+10,hy+3); ctx.lineTo(hx-10,hy+3); ctx.closePath();
    ctx.fillStyle='#eef3f6'; ctx.fill();
    ctx.strokeStyle='rgba(10,16,26,0.45)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#43535e'; rr(hx-9,hy-6,18,6,3); ctx.fill();
  }

  var low = S.papers <= 2;
  if(low){
    var lp = .5+.5*Math.sin(S.t*8);
    ctx.globalAlpha = .35+.45*lp;
    fillRR(12,76,104,38,19,C.bad);
    ctx.globalAlpha = 1;
  }
  fillRR(16,80,96,30,15,'rgba(10,16,26,0.5)');
  fillRR(26,89,20,13,3,C.paper);
  ctx.fillStyle=C.paperInk; ctx.fillRect(30,93,12,2);
  label(String(S.papers),54,101,18,S.papers>0?C.hud:C.bad,'left','800');

  var prog=clamp(S.trackPos/S.trackLen,0,1);
  fillRR(16,DH-26,DW-32,8,4,'rgba(10,16,26,0.5)');
  fillRR(16,DH-26,(DW-32)*prog,8,4,C.gold);

  if(S.combo>1) label('COMBO x'+S.combo,DW/2,124,20,C.gold,'center','800');

  drawTurnSign();
  drawAimGauges();

  if(S.calloutT>0){
    ctx.globalAlpha=clamp(S.calloutT*1.6,0,1);
    label(S.callout,DW/2,176,26,S.calloutCol,'center','800');
    ctx.globalAlpha=1;
  }

  if(S.tutorial>0){
    ctx.globalAlpha=Math.min(1,S.tutorial/1.2);
    fillRR(24,DH-206,DW-48,96,18,C.panel);
    label('Swipe or ← → to change lane',DW/2,DH-176,15,C.hud,'center','600');
    label('Tap a side when its bar turns green',DW/2,DH-152,15,C.hud,'center','600');
    label('Only pinned houses want a paper',DW/2,DH-128,15,C.pin,'center','700');
    ctx.globalAlpha=1;
  }
}

/* the timing bar: fills as you close on the house, green = throw now */
function drawAimGauges(){
  [-1,1].forEach(function(side){
    var h = findTarget(side);
    if(!h) return;
    var rel = h.z - S.trackPos;
    if(rel > 30) return;

    var x = side<0 ? 42 : DW-42;
    var top = 236, len = 188, wBar = 20;

    /* travel of the gauge head: 30 units away at the top, landing point at the bottom */
    var err = h.z - landZ();                 // >0 too early, <0 too late
    var SPAN = 26;
    var headT = clamp((SPAN/2 - err)/SPAN, 0, 1);

    fillRR(x-wBar/2-2, top-2, wBar+4, len+4, (wBar+4)/2, 'rgba(255,255,255,0.30)');
    fillRR(x-wBar/2, top, wBar, len, wBar/2, 'rgba(10,16,26,0.72)');

    /* green band = where a throw connects */
    var tLo = clamp((SPAN/2-HIT_TOL)/SPAN,0,1), tHi = clamp((SPAN/2+HIT_TOL)/SPAN,0,1);
    var pLo = clamp((SPAN/2-PERFECT_TOL)/SPAN,0,1), pHi = clamp((SPAN/2+PERFECT_TOL)/SPAN,0,1);
    fillRR(x-wBar/2, top+len*tLo, wBar, len*(tHi-tLo), wBar/2, 'rgba(34,189,88,0.45)');
    fillRR(x-wBar/2, top+len*pLo, wBar, len*(pHi-pLo), wBar/2, 'rgba(34,189,88,0.95)');

    /* head */
    var hy = top + len*headT;
    var inZone = Math.abs(err) <= HIT_TOL;
    circle(x, hy, 11, inZone ? '#fff' : 'rgba(255,255,255,0.8)');
    circle(x, hy, 6, inZone ? C.good : C.pin);

    /* side chevron + prompt */
    var py = 208, pulse = .5+.5*Math.sin(S.t*7);
    ctx.globalAlpha = inZone ? (0.85+0.15*pulse) : 0.5;
    circle(x, py, 24, inZone ? C.good : 'rgba(255,138,21,0.85)');
    ctx.globalAlpha = 1;
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(x-side*6,py-9); ctx.lineTo(x+side*6,py); ctx.lineTo(x-side*6,py+9);
    ctx.stroke(); ctx.lineCap='butt';
    if(inZone) label('THROW', x, top+len+22, 13, C.good, 'center','800');
  });
}

/* Junction ahead: which way the road is about to swing. It is not an input
   prompt — the bend is automatic — it is there so the lean is not a surprise. */
function drawTurnSign(){
  if(S.turnT<=0 || !S.turnSign) return;
  var a = clamp(S.turnT/2.0, 0, 1);
  var dir = S.turnSign, x = DW/2, y = 150;
  ctx.globalAlpha = a * (0.65+0.35*(0.5+0.5*Math.sin(S.t*9)));
  fillRR(x-58, y-24, 116, 44, 12, 'rgba(255,199,58,0.92)');
  ctx.strokeStyle='rgba(40,30,0,0.55)'; ctx.lineWidth=2;
  rr(x-58, y-24, 116, 44, 12); ctx.stroke();
  ctx.strokeStyle='#231505'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(x-dir*22, y+8); ctx.lineTo(x-dir*22, y-2);
  ctx.quadraticCurveTo(x-dir*22, y-12, x-dir*8, y-12);
  ctx.lineTo(x+dir*16, y-12);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+dir*6, y-22); ctx.lineTo(x+dir*20, y-12); ctx.lineTo(x+dir*6, y-2);
  ctx.stroke(); ctx.lineCap='butt';
  ctx.globalAlpha = 1;
}

/* ---- render/screens.js ---- */
// Full-screen overlays: title, street cleared, round over.

function panel(y,h){ fillRR(26,y,DW-52,h,22,C.panel); }
function button(cx,cy,w,h,txt){

function bullet(x,y,t){ circle(x-14,y-5,4,C.pin); label(t,x,y,14,C.hud,'left','500'); }
function drawClear(){
  panel(196,290);
  if(S.failed){
    label('STREET MISSED',DW/2,250,26,C.bad,'center','800');

function drawOver(){

}

/* ---- render/scene.js ---- */
// Composites one frame: background, depth-sorted world, effects, rider, UI.

/* The visible list is rebuilt every frame; pooling the entries keeps that
   from allocating a few hundred short-lived objects a second. */
var pool = [], order = [], poolN = 0;
function visPush(o, rel){
  var e = pool[poolN];
  if(!e){ e = { o:null, rel:0 }; pool[poolN] = e; }
  poolN++;
  e.o = o; e.rel = rel;
  order.push(e);
}
function byDepth(a,b){ return b.rel-a.rel; }

/* Scenery is drawn from the far cutoff inwards; the haze goes down once the
   pass crosses this depth, so anything beyond it appears through mist instead
   of popping into existence. */
var HAZE_Z = 46;

function render(){
  ctx.save();

  /* camera: shake, bob, a little lateral lag behind the rider, and roll */
  var tx = 0, ty = S.camBob;
  if(S.shake>0){ tx += rnd(-S.shake,S.shake)*.5; ty += rnd(-S.shake,S.shake)*.35; }
  tx += (S.px - S.camX) * 26;
  ctx.translate(tx, ty);
  if(S.camRoll){
    ctx.translate(DW/2, DH);
    ctx.rotate(-S.camRoll*0.08);
    ctx.translate(-DW/2, -DH);
  }

  drawSky(); drawSkyline(); drawGround();

  poolN = 0; order.length = 0;
  var i, o, rel;
  for(i=0;i<S.objs.length;i++){
    o=S.objs[i]; rel=o.z-S.trackPos;
    if(rel<1.3 || rel>Z_FAR) continue;
    if((o.kind==='obs' || o.kind==='pickup') && rel<2.1) continue;
    if(o.kind==='pickup' && o.taken) continue;
    if(o.kind==='cross' && o.phase==='gone') continue;
    visPush(o, rel);
  }
  order.sort(byDepth);

  var hazed = false;
  for(i=0;i<order.length;i++){
    var v = order[i];
    if(!hazed && v.rel < HAZE_Z){ drawHaze(); hazed = true; }
    var k = v.o.kind;
    if(k==='house')         drawHouse(v.o, v.rel);
    else if(k==='landmark') drawLandmark(v.o, v.rel);
    else if(k==='prop')     drawProp(v.o, v.rel);
    else if(k==='obs')      drawObstacle(v.o, v.rel);
    else if(k==='cross')    drawCrossing(v.o, v.rel);
    else if(k==='pickup')   drawPickup(v.o, v.rel);
    else if(k==='bunting')  drawBunting(v.o, v.rel);
  }
  if(!hazed) drawHaze();

  for(i=0;i<S.dust.length;i++){ if(S.dust[i].active) drawDust(S.dust[i]); }

  for(i=0;i<S.pops.length;i++){
    var pp=S.pops[i], rel2=pp.z-S.trackPos;
    if(rel2<1.6 || rel2>40) continue;
    var p=ppuAt(rel2);
    ctx.globalAlpha=clamp(pp.t,0,1);
    label(pp.txt, sxAt(pp.x,rel2,S.px), yAt(rel2)-p*1.1-(1-pp.t)*44, 18, pp.col,'center','800');
    ctx.globalAlpha=1;
  }

  for(i=0;i<S.shots.length;i++) drawShot(S.shots[i]);

  drawRider();
  ctx.restore();

  if(S.mode==='title') drawTitle();
  else {
    drawHUD();
    if(S.mode==='clear') drawClear();
    if(S.mode==='over') drawOver();
  }
}

/* ---- main.js ---- */
/* Paper Round — entry point.
   Wires the modules together: build the first street, attach controls,
   then run a fixed update/render loop off requestAnimationFrame. */


initDust();
buildLevel(1);
attachInput();

if (typeof window!=='undefined' && window.requestAnimationFrame){
  var last=performance.now();
  (function frame(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    update(dt); render(); requestAnimationFrame(frame);
  })(last);
}

/* Test seam: harnesses set globalThis.__HOOK__ before loading this module. */
if (typeof globalThis!=='undefined' && globalThis.__HOOK__){
  globalThis.__HOOK__({ S:S, update:update, render:render, buildLevel:buildLevel,
    startGame:startGame, toss:toss, setLane:setLane, findTarget:findTarget, landZ:landZ,
    nextStreet:nextStreet, press:press });
}

})();
