(function(){
"use strict";

/* ---- game/state.js ---- */
// The single mutable game state object. Every module reads and writes this one.
var S = {
  mode:'title', level:1, score:0, lives:3, best:0,
  trackPos:0, trackLen:0, speed:8.5,
  lane:1, px:0, lean:0,
  papers:0, delivered:0, need:0, targets:0,
  objs:[], shots:[], pops:[], dust:[],
  t:0, stun:0, shake:0, combo:0,
  arm:0, armSide:1,
  tutorial:0, perfect:false, failed:false,
  callout:'', calloutT:0, calloutCol:'#fff'
};

/* ---- core/math.js ---- */
// Small numeric helpers. No canvas, no state.
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function shade(hex,amt){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=clamp(Math.round(r+255*amt),0,255); g=clamp(Math.round(g+255*amt),0,255); b=clamp(Math.round(b+255*amt),0,255);
  return 'rgb('+r+','+g+','+b+')';
}

function pick2(seed, arr){ return arr[Math.floor(seed)%arr.length]; }

/* ---- core/canvas.js ---- */
// Backing canvas: fixed 400x700 design space, scaled to the device pixel ratio.
var DW = 400, DH = 700;
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(DW*dpr); cv.height = Math.round(DH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
if (typeof window !== 'undefined' && window.addEventListener){ resize(); window.addEventListener('resize', resize); }

/* ---- core/projection.js ---- */
// The pinhole camera that turns world (x, z) into screen (x, y).

var HORIZON = 250;
var CAMH = 1.6, FOCAL = 330;       // wide lens: the street reads wide
var ROAD_HALF = 1.35;
var LANES = [-0.80, 0, 0.80];
var HOUSE_X = 2.70;
var FLIGHT = 0.45;                 // seconds a paper spends in the air
var LEAD   = 1.6;                  // how far ahead of you it lands

function yAt(z){ return HORIZON + CAMH*FOCAL/z; }
function ppuAt(z){ return FOCAL/z; }
function sxAt(x,z,px){ return DW/2 + (x-px)*ppuAt(z); }

/* ---- core/palette.js ---- */
// Every colour in the game, in one place.
var C = {
  skyTop:'#4e9fd4', skyMid:'#8ec6e4', skyLow:'#dceff4', sun:'#fff3c6',
  far:'#9fb0bc', far2:'#8799a8',
  field:'#a8c46e', field2:'#93b25c', dryGrass:'#cbbd7c',
  shoulder:'#c6ac7c', road:'#6f6a62', roadLite:'#7c7770', patch:'#5e5a53',
  lane:'#efe2ad',
  ink:'#23252a',
  pin:'#ff8a15', pinDone:'#22bd58',
  paper:'#fdfbf0', paperInk:'#c4452f',
  hud:'#ffffff', hudDim:'rgba(255,255,255,0.66)', panel:'rgba(14,20,30,0.9)',
  bad:'#e8503a', good:'#22bd58', gold:'#ffc63a',
  saffron:'#ff9933', green:'#138808'
};
var WALLS = ['#f6e7c6','#dfeadb','#efd9c6','#d9e8f2','#eadfef','#f2e3cf','#cfe3d8'];
var ROOFS = ['#b4573f','#7d8a97','#9c6b4a','#5f7f8c','#a8724f'];

/* ---- game/level.js ---- */
// Procedurally lays out one street: houses, the round, verge dressing, obstacles, bundles.

function buildLevel(n){
  var lv = Math.min(n,8);
  S.trackLen = 200 + lv*38;
  S.speed    = 8.5 + lv*0.35;
  S.targets  = 5 + Math.min(n,5);
  S.papers   = S.targets + 6;
  S.trackPos = 0; S.lane = 1; S.px = 0; S.lean = 0;
  S.delivered = 0; S.combo = 0; S.stun = 0; S.shake = 0; S.arm = 0;
  S.objs = []; S.shots = []; S.pops = []; S.dust = [];
  S.perfect = false;

  var z, side, i;

  /* frontage both sides */
  for(side=-1; side<=1; side+=2){
    z = rnd(14,20);
    while(z < S.trackLen + 80){
      S.objs.push({
        kind:'house', side:side, x:side*HOUSE_X, z:z,
        w:rnd(1.75,2.05), h:rnd(1.6,2.0),
        wall:pick(WALLS), roof:pick(ROOFS),
        storey:(Math.random()<0.30?2:1),
        shop:(Math.random()<0.28),
        target:false, done:false, claimed:false, tried:false,
        seed:Math.random()*10
      });
      z += rnd(3.4,5.0);
    }
  }

  /* the round */
  var cand = S.objs.filter(function(o){ return o.z>26 && o.z<S.trackLen-8; });
  cand.sort(function(a,b){ return a.z-b.z; });
  var step = cand.length/S.targets, placed = 0;
  for(i=0;i<S.targets;i++){
    var idx = Math.min(cand.length-1, Math.round(i*step + rnd(0, step*0.5)));
    if(cand[idx] && !cand[idx].target){ cand[idx].target=true; cand[idx].shop=false; placed++; }
  }
  S.targets = placed;
  S.need = Math.max(3, Math.ceil(S.targets*0.65));

  /* verge dressing */
  for(z=12; z<S.trackLen+70; z+=rnd(5,9)){
    S.objs.push({ kind:'prop', type:pick(['pole','tree','tree','hoarding','handpump']),
                  x:(Math.random()<0.5?-1:1)*rnd(1.55,1.95), z:z, seed:Math.random()*10 });
  }
  /* chai stalls and dogs, occasional */
  for(z=30; z<S.trackLen; z+=rnd(40,70)){
    S.objs.push({ kind:'prop', type:'chai', x:(Math.random()<0.5?-1:1)*1.75, z:z, seed:Math.random()*10 });
  }
  for(z=45; z<S.trackLen; z+=rnd(35,60)){
    S.objs.push({ kind:'prop', type:'dog', x:(Math.random()<0.5?-1:1)*rnd(1.5,1.8), z:z, seed:Math.random()*10 });
  }
  /* bunting across the street */
  for(z=55; z<S.trackLen; z+=rnd(55,90)){
    S.objs.push({ kind:'bunting', x:0, z:z, seed:Math.random()*10 });
  }

  /* obstacles: sparse, one free lane always reachable */
  var types = ['cow','auto','thela','pothole','scooter','tempo'];
  var freeLane = 1;
  var gap = Math.max(11, 17 - lv*0.6);
  for(z=34; z<S.trackLen-12; z+=rnd(gap, gap+6)){
    var opts = [freeLane-1, freeLane, freeLane+1].filter(function(l){ return l>=0&&l<=2; });
    freeLane = opts[(Math.random()*opts.length)|0];
    var others = [0,1,2].filter(function(l){ return l!==freeLane; });
    var two = Math.random() < (0.12 + lv*0.045);
    if(!two) others = [others[(Math.random()*others.length)|0]];
    for(i=0;i<others.length;i++){
      var lane = others[i];
      var t = pick(types);
      if(t==='tempo' && lane===1) t = 'thela';
      if((t==='tempo'||t==='auto') && others.length>1) t = 'pothole';
      S.objs.push({ kind:'obs', type:t, lane:lane, x:LANES[lane], z:z+rnd(-0.4,0.4),
                    checked:false, seed:Math.random()*10,
                    vz:(t==='auto'? rnd(2.5,4) : t==='tempo'? -rnd(3,4.5) : 0) });
    }
  }

  /* bundles */
  for(z=50; z<S.trackLen-20; z+=rnd(45,70)){
    var ln = (Math.random()*3)|0;
    S.objs.push({ kind:'pickup', lane:ln, x:LANES[ln], z:z, taken:false, checked:false });
  }

  S.objs.sort(function(a,b){ return a.z-b.z; });
}

/* ---- core/audio.js ---- */
// One oscillator per sound effect. Silent if the browser has no AudioContext.
var actx=null, muted=false;
function blip(f,d,type){
  if(muted || typeof window==='undefined') return;
  try{
    if(!actx){ var A=window.AudioContext||window.webkitAudioContext; if(!A) return; actx=new A(); }
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'triangle'; o.frequency.value=f; g.gain.value=0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}

function toggleMute(){ muted = !muted; return muted; }
/* Browsers start the context suspended until the first gesture. */
function resumeAudio(){ if(actx && actx.state==='suspended') actx.resume(); }

/* ---- game/throwing.js ---- */
// Throw timing: which house you are aiming at, and how well you timed it.

/* the paper lands here, in world z, if thrown right now */
function landZ(){ return S.trackPos + S.speed*FLIGHT + LEAD; }
var PERFECT_TOL = 1.5, HIT_TOL = 3.4;

function findTarget(side){
  var best=null, bd=1e9;
  for(var i=0;i<S.objs.length;i++){
    var o = S.objs[i];
    if(o.kind!=='house' || !o.target || o.done || o.claimed) continue;
    if(o.side!==side) continue;
    var rel = o.z - S.trackPos;
    if(rel < -2 || rel > 30) continue;
    if(rel < bd){ bd=rel; best=o; }
  }
  return best;
}
/* 0 when the house is far, 1 when the paper would land past it */
function aimProgress(house){
  var span = 30;
  var err = house.z - landZ();          // +ve: house still ahead of the landing point
  return clamp(1 - (err/span + 0.5) + 0.5, 0, 1);
}

function toss(side){
  if(S.mode!=='play' || S.stun>0 || S.arm>0) return;
  if(S.papers<=0){ callout('NO PAPERS LEFT', C.bad); return; }
  var tgt = findTarget(side);
  S.papers--;
  S.arm = 0.34; S.armSide = side;

  var lz = landZ();
  var err = tgt ? (tgt.z - lz) : 0;
  var grade = 'miss';
  if(tgt){
    if(Math.abs(err) <= PERFECT_TOL) grade = 'perfect';
    else if(Math.abs(err) <= HIT_TOL) grade = 'hit';
    else grade = (err > 0) ? 'early' : 'late';
  }
  if(grade === 'miss') { S.combo = 0; S.score = Math.max(0, S.score-15); }
  if(grade === 'early' || grade === 'late'){ S.combo = 0; }
  if(tgt && (grade==='perfect'||grade==='hit')) tgt.claimed = true;

  S.shots.push({
    side:side, t:0, house:tgt, grade:grade,
    landZ: lz, landX: side*(HOUSE_X - (grade==='perfect'||grade==='hit' ? 0.72 : 1.25)),
    spin:0
  });
  blip(grade==='perfect'?900:grade==='hit'?760:300, .07);
}
function callout(txt,col){ S.callout=txt; S.calloutCol=col; S.calloutT=1.1; }

/* ---- game/actions.js ---- */
// Player actions and their consequences.

function setLane(dir){
  if(S.mode!=='play' || S.stun>0) return;
  var nl = clamp(S.lane+dir,0,2);
  if(nl!==S.lane){ S.lane=nl; blip(400,.05); }
}
function crash(){
  if(S.stun>0) return;
  S.lives--; S.combo=0; S.stun=1.2; S.shake=16;
  callout('CRASH!', C.bad);
  blip(85,.32,'sawtooth');
  for(var i=0;i<14;i++) S.dust.push({ x:S.px+rnd(-.5,.5), z:S.trackPos+rnd(2.5,5), t:1, r:rnd(0.10,0.22) });
  if(S.lives<=0){ S.mode='over'; if(S.score>S.best) S.best=S.score; }
}

/* ---- game/update.js ---- */
// One simulation step: movement, papers in flight, collisions, end of street.

function update(dt){
  S.t += dt;
  if(S.shake>0) S.shake = Math.max(0, S.shake-dt*30);
  if(S.tutorial>0) S.tutorial -= dt;
  if(S.arm>0) S.arm -= dt;
  if(S.calloutT>0) S.calloutT -= dt;

  if(S.mode==='title'){ S.trackPos += S.speed*0.5*dt; return; }
  if(S.mode!=='play') return;
  if(S.stun>0) S.stun -= dt;

  S.trackPos += S.speed*dt;

  var tx = LANES[S.lane], d = tx - S.px;
  S.px += d*Math.min(1, dt*12);
  S.lean += (d*2.0 - S.lean)*Math.min(1, dt*8);

  var i,o,rel;

  for(i=0;i<S.objs.length;i++){ o=S.objs[i]; if(o.kind==='obs'&&o.vz) o.z += o.vz*dt; }

  /* papers in flight */
  for(i=S.shots.length-1;i>=0;i--){
    var s = S.shots[i];
    s.t += dt/FLIGHT;
    s.spin += dt*10;
    if(s.t>=1){
      var puffZ = s.landZ, puffX = s.landX;
      for(var k=0;k<7;k++) S.dust.push({ x:puffX+rnd(-.15,.15), z:puffZ+rnd(-.15,.15), t:1, r:rnd(0.06,0.13) });
      if(s.grade==='perfect'||s.grade==='hit'){
        if(s.house && !s.house.done){
          s.house.done = true; S.delivered++; S.combo++;
          var pts = (s.grade==='perfect'?150:100) + (S.combo-1)*25;
          S.score += pts;
          S.pops.push({ x:s.house.x, z:s.house.z, t:1, txt:'+'+pts, col:C.good });
          callout(s.grade==='perfect' ? 'PERFECT!' : 'DELIVERED', C.good);
          blip(980,.09);
        }
      } else if(s.grade==='early'){
        callout('TOO EARLY', C.bad);
        if(s.house) s.house.claimed = false;
      } else if(s.grade==='late'){
        callout('TOO LATE', C.bad);
        if(s.house) s.house.claimed = false;
      } else {
        callout('NO HOUSE THERE', C.bad);
      }
      S.shots.splice(i,1);
    }
  }

  for(i=S.pops.length-1;i>=0;i--){ S.pops[i].t -= dt*1.2; if(S.pops[i].t<=0) S.pops.splice(i,1); }
  for(i=S.dust.length-1;i>=0;i--){ S.dust[i].t -= dt*1.6; if(S.dust[i].t<=0) S.dust.splice(i,1); }

  /* collisions */
  for(i=0;i<S.objs.length;i++){
    o = S.objs[i]; rel = o.z - S.trackPos;
    if(o.kind==='obs' && !o.checked && rel<0.9){
      o.checked = true;
      if(S.stun<=0 && Math.abs(o.x-S.px) < 0.42) crash();
    } else if(o.kind==='pickup' && !o.checked && rel<0.9){
      o.checked = true;
      if(Math.abs(o.x-S.px) < 0.45){
        o.taken = true; S.papers += 6; S.score += 40;
        S.pops.push({ x:o.x, z:o.z, t:1, txt:'+6', col:C.hud });
        blip(600,.08,'sine');
      }
    } else if(o.kind==='house' && o.target && !o.done && !o.tried && rel < -3){
      o.tried = true; S.combo = 0;
    }
  }

  if(S.trackPos >= S.trackLen){
    if(S.delivered >= S.need){
      S.perfect = (S.delivered === S.targets);
      S.score += 250 + S.delivered*30 + S.papers*5;
      if(S.perfect && S.lives<5) S.lives++;
      S.failed = false; S.mode='clear'; blip(700,.12);
    } else {
      S.lives--; S.failed = true;
      if(S.lives<=0){ S.mode='over'; if(S.score>S.best) S.best=S.score; }
      else S.mode='clear';
      blip(170,.3,'sawtooth');
    }
  }
}

/* ---- game/flow.js ---- */
// Moving between title, play, street-cleared and game-over.

function startGame(){
  S.level=1; S.score=0; S.lives=3; S.failed=false;
  buildLevel(1); S.tutorial=5; S.mode='play';
}
function nextStreet(){
  if(S.failed){ S.failed=false; buildLevel(S.level); }
  else { S.level++; buildLevel(S.level); }
  S.mode='play';
}
function press(){
  resumeAudio();
  if(S.mode==='title') startGame();
  else if(S.mode==='clear') nextStreet();
  else if(S.mode==='over') startGame();
}

/* ---- game/input.js ---- */
// Pointer (swipe to steer, tap a side to throw) and keyboard controls.

function attachInput(){
  if (typeof window!=='undefined' && window.addEventListener){
    var down=null;
    cv.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var r=cv.getBoundingClientRect();
      down={ x:(e.clientX-r.left)/r.width*DW, y:(e.clientY-r.top)/r.height*DH, moved:false };
    });
    cv.addEventListener('pointermove',function(e){
      if(!down||down.moved) return;
      var r=cv.getBoundingClientRect();
      var dx=(e.clientX-r.left)/r.width*DW - down.x;
      if(Math.abs(dx)>26){ down.moved=true; setLane(dx>0?1:-1); }
    });
    cv.addEventListener('pointerup',function(){
      if(!down) return;
      var swipe=down.moved, x=down.x; down=null;
      if(S.mode!=='play'){ press(); return; }
      if(!swipe) toss(x<DW/2?-1:1);
    });
    cv.addEventListener('pointercancel',function(){ down=null; });

    window.addEventListener('keydown',function(e){
      var k=e.key.toLowerCase();
      if(['arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
      if(e.repeat) return;
      if(S.mode!=='play'){ if(k===' '||k==='enter') press(); return; }
      if(k==='arrowleft') setLane(-1);
      if(k==='arrowright') setLane(1);
      if(k==='q'||k==='a'||k==='z') toss(-1);
      if(k==='e'||k==='d'||k==='m') toss(1);
      if(k==='p') toggleMute();
    },{passive:false});
  }
}

/* ---- core/draw.js ---- */
// Thin wrappers over the 2D context so the draw code stays readable.

function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ rr(x,y,w,h,r); ctx.fillStyle=col; ctx.fill(); }
function poly(pts,col){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
function circle(x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fillStyle=col; ctx.fill(); }
function label(s,x,y,size,col,align,weight){
  ctx.font=(weight||'600')+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=col||C.hud; ctx.fillText(s,x,y);
}

/* ---- render/background.js ---- */
// Sky, distant skyline, and the road surface under the rider.

function drawSky(){
  var g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,C.skyTop); g.addColorStop(.6,C.skyMid); g.addColorStop(1,C.skyLow);
  ctx.fillStyle=g; ctx.fillRect(0,0,DW,HORIZON);
  circle(298,150,40,'rgba(255,243,198,0.45)'); circle(298,150,25,C.sun);
  ctx.globalAlpha=.8; cloud(70,56,34); cloud(196,36,26); cloud(340,78,22); ctx.globalAlpha=1;
  /* a couple of birds */
  ctx.strokeStyle='rgba(40,60,75,0.45)'; ctx.lineWidth=1.6;
  for(var i=0;i<3;i++){
    var bx = 110+i*34 + Math.sin(S.t*0.5+i)*8, by = 96+i*9;
    ctx.beginPath();
    ctx.moveTo(bx-6,by); ctx.quadraticCurveTo(bx-3,by-4,bx,by);
    ctx.quadraticCurveTo(bx+3,by-4,bx+6,by); ctx.stroke();
  }
}
function cloud(x,y,r){
  circle(x,y,r*.62,'#fff'); circle(x+r*.6,y+r*.12,r*.46,'#fff'); circle(x-r*.6,y+r*.16,r*.4,'#fff');
  ctx.fillStyle='#fff'; ctx.fillRect(x-r*.6,y,r*1.2,r*.5);
}
function drawSkyline(){
  var off = -(S.trackPos*1.4)%440;
  for(var pass=0;pass<2;pass++){
    ctx.save(); ctx.translate(off+pass*440,0); ctx.globalAlpha=.45;
    ctx.fillStyle=C.far2;
    ctx.fillRect(14,HORIZON-30,52,30); ctx.fillRect(74,HORIZON-19,34,19);
    ctx.fillRect(256,HORIZON-26,58,26); ctx.fillRect(372,HORIZON-18,44,18);
    /* temple */
    poly([[118,HORIZON],[118,HORIZON-24],[132,HORIZON-58],[146,HORIZON-24],[146,HORIZON]],C.far);
    circle(132,HORIZON-62,4,C.far);
    /* mosque */
    ctx.beginPath(); ctx.arc(192,HORIZON-28,15,Math.PI,0); ctx.fillStyle=C.far; ctx.fill();
    ctx.fillRect(177,HORIZON-28,30,28); ctx.fillRect(210,HORIZON-50,6,50);
    /* water tank */
    ctx.fillStyle=C.far2;
    ctx.fillRect(320,HORIZON-50,28,15);
    ctx.fillRect(325,HORIZON-35,4,35); ctx.fillRect(340,HORIZON-35,4,35);
    palm(236,HORIZON,30); palm(100,HORIZON,24);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function palm(x,ground,h){
  ctx.fillStyle=C.far2; ctx.fillRect(x-1.5,ground-h,3,h);
  ctx.strokeStyle=C.far2; ctx.lineWidth=3;
  for(var i=0;i<5;i++){
    var a=-Math.PI/2+(i-2)*.55;
    ctx.beginPath(); ctx.moveTo(x,ground-h);
    ctx.quadraticCurveTo(x+Math.cos(a)*14,ground-h+Math.sin(a)*10,x+Math.cos(a)*20,ground-h+Math.sin(a)*4);
    ctx.stroke();
  }
}
function drawGround(){
  var g = ctx.createLinearGradient(0,HORIZON,0,DH);
  g.addColorStop(0,C.field2); g.addColorStop(1,C.field);
  ctx.fillStyle=g; ctx.fillRect(0,HORIZON,DW,DH-HORIZON);

  var zF=70, zN=1.25;
  var yF=yAt(zF), yN=yAt(zN), pF=ppuAt(zF), pN=ppuAt(zN);
  var cF=DW/2-S.px*pF, cN=DW/2-S.px*pN;

  poly([[cF-(ROAD_HALF+.55)*pF,yF],[cF+(ROAD_HALF+.55)*pF,yF],
        [cN+(ROAD_HALF+.55)*pN,yN],[cN-(ROAD_HALF+.55)*pN,yN]], C.shoulder);
  poly([[cF-ROAD_HALF*pF,yF],[cF+ROAD_HALF*pF,yF],
        [cN+ROAD_HALF*pN,yN],[cN-ROAD_HALF*pN,yN]], C.road);

  /* tar patches */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cF-ROAD_HALF*pF,yF); ctx.lineTo(cF+ROAD_HALF*pF,yF);
  ctx.lineTo(cN+ROAD_HALF*pN,yN); ctx.lineTo(cN-ROAD_HALF*pN,yN); ctx.closePath(); ctx.clip();
  var phase=S.trackPos%9;
  for(var k=0;k<10;k++){
    var z=2+k*9-phase; if(z<1.4) continue;
    var y=yAt(z), p=ppuAt(z), c=DW/2-S.px*p;
    ctx.globalAlpha=.45; ctx.fillStyle=(k%2)?C.roadLite:C.patch;
    ctx.beginPath(); ctx.ellipse(c+Math.sin(k*2.3)*p*.5, y, p*.6, Math.max(2,p*.08),0,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();

  var hz = ctx.createLinearGradient(0,HORIZON,0,HORIZON+66);
  hz.addColorStop(0,'rgba(220,239,244,0.8)'); hz.addColorStop(1,'rgba(220,239,244,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,HORIZON,DW,66);

  dashes(-0.40); dashes(0.40);
  edge(-ROAD_HALF+0.06); edge(ROAD_HALF-0.06);
}
function dashes(xo){
  var phase=S.trackPos%7;
  for(var k=0;k<14;k++){
    var z0=1.8+k*7-phase, z1=z0+3.4;
    if(z1<1.4) continue; if(z0>66) break;
    z0=Math.max(z0,1.4);
    var y0=yAt(z0),y1=yAt(z1),p0=ppuAt(z0),p1=ppuAt(z1);
    var c0=DW/2-S.px*p0, c1=DW/2-S.px*p1;
    var w0=Math.max(.7,p0*.016), w1=Math.max(.4,p1*.016);
    poly([[c0+xo*p0-w0,y0],[c0+xo*p0+w0,y0],[c1+xo*p1+w1,y1],[c1+xo*p1-w1,y1]],'rgba(239,226,173,0.6)');
  }
}
function edge(x){
  var zF=64,zN=1.4, yF=yAt(zF),yN=yAt(zN),pF=ppuAt(zF),pN=ppuAt(zN);
  var cF=DW/2-S.px*pF, cN=DW/2-S.px*pN;
  poly([[cF+x*pF-.6,yF],[cF+x*pF+.6,yF],[cN+x*pN+3,yN],[cN+x*pN-3,yN]],'rgba(255,255,255,0.32)');
}

/* ---- render/houses.js ---- */
// The frontage: houses, shops, compound walls, and the pin over a house on the round.

function drawHouse(o, rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  var w=o.w*p, h=o.h*p*(o.storey===2?1.38:1);
  if(cx+w< -60 || cx-w > DW+60) return;
  var x0=cx-w/2, y0=y-h;

  ctx.globalAlpha=.16;
  ctx.beginPath(); ctx.ellipse(cx,y,w*.6,Math.max(2,p*.05),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  var wall = o.target ? o.wall : shade(o.wall,-0.06);
  fillRR(x0,y0,w,h,p*.02,wall);
  ctx.fillStyle='rgba(0,0,0,0.09)';
  ctx.fillRect(o.side>0?x0:x0+w*.74, y0, w*.26, h);

  /* roof slab with a small parapet */
  var rh=Math.max(3,h*.09);
  fillRR(x0-w*.05,y0-rh,w*1.10,rh*1.3,p*.012,o.roof);
  fillRR(x0-w*.02,y0-rh*1.9,w*.10,rh*1.0,p*.01,shade(o.roof,-.08));
  fillRR(x0+w*.92,y0-rh*1.9,w*.10,rh*1.0,p*.01,shade(o.roof,-.08));
  /* water tank on the roof */
  if(o.seed>5){
    fillRR(cx+w*.22, y0-rh*2.6, w*.20, rh*1.6, p*.012, '#2f6ea8');
  }

  if(o.shop){
    /* shuttered shop with a painted board */
    var by0=y-h*.52;
    fillRR(x0+w*.06, y0+h*.10, w*.88, h*.16, p*.01, pick2(o.seed,['#e8b93a','#3f8f6b','#c9553c']));
    ctx.fillStyle='rgba(255,255,255,0.75)';
    for(var q=0;q<4;q++) ctx.fillRect(x0+w*.14+q*w*.19, y0+h*.155, w*.11, Math.max(1.5,h*.022));
    fillRR(x0+w*.10, by0, w*.80, h*.50, p*.01, '#8b949a');
    ctx.fillStyle='rgba(0,0,0,0.12)';
    for(var r2=0;r2<7;r2++) ctx.fillRect(x0+w*.10, by0+r2*h*.07, w*.80, Math.max(1,h*.02));
  } else {
    var wy=y0+h*.22, ww=w*.16, wh=h*.16;
    var win = o.target ? '#a9dcef' : '#a9b7bd';
    fillRR(cx-w*.30,wy,ww,wh,p*.008,win);
    fillRR(cx+w*.14,wy,ww,wh,p*.008,win);
    if(o.storey===2){
      fillRR(cx-w*.30,wy+h*.30,ww,wh,p*.008,win);
      fillRR(cx+w*.14,wy+h*.30,ww,wh,p*.008,win);
      /* balcony rail */
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=Math.max(1,p*.012);
      ctx.beginPath(); ctx.moveTo(cx-w*.36,wy+h*.50); ctx.lineTo(cx+w*.36,wy+h*.50); ctx.stroke();
    }
    fillRR(cx-w*.11, y-h*.30, w*.22, h*.30, p*.012, '#7a5336');
  }

  /* compound wall + gate */
  var bw=w*1.04, bh=h*.24, bx=cx-bw/2, by=y-bh*.62;
  fillRR(bx,by,bw,bh,p*.008, shade(wall,-.16));
  ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fillRect(bx,by,bw,bh*.16);
  var gw=bw*.30, gx=cx-gw/2;
  if(o.target && !o.done){
    fillRR(gx-gw*.14,by,gw*.16,bh,p*.008,'#93a0a8');
    fillRR(gx+gw*.98,by,gw*.16,bh,p*.008,'#93a0a8');
  } else {
    fillRR(gx,by,gw,bh,p*.008,'#93a0a8');
    ctx.fillStyle='rgba(0,0,0,0.16)';
    for(var i=1;i<4;i++) ctx.fillRect(gx+gw*i/4, by, Math.max(.7,p*.006), bh);
  }

  /* delivered paper sitting at the gate */
  if(o.done){
    fillRR(cx-p*.07, y-p*.05, p*.14, p*.07, p*.015, C.paper);
  }

  if(o.target){
    var pulse = .5+.5*Math.sin(S.t*4 + o.seed);
    if(!o.done){
      ctx.strokeStyle='rgba(255,138,21,'+(0.30+0.40*pulse)+')';
      ctx.lineWidth=Math.max(2,p*.022);
      ctx.beginPath();
      ctx.ellipse(cx, y+p*.04, w*.36*(.88+.12*pulse), Math.max(3,p*.06*(.88+.12*pulse)),0,0,6.2832);
      ctx.stroke();
      /* soft glow on the facade */
      ctx.globalAlpha = 0.10+0.10*pulse;
      fillRR(x0,y0,w,h,p*.02,C.pin);
      ctx.globalAlpha = 1;
    }
    drawPin(cx, y0 - rh*2 - p*.26 - Math.sin(S.t*3.4+o.seed)*p*.035, p, o.done);
  }
}

function drawPin(x,y,p,done){
  var s = clamp(p*.34, 16, 54);
  var col = done?C.pinDone:C.pin;
  ctx.beginPath();
  ctx.arc(x, y-s*.62, s*.62, Math.PI*.86, Math.PI*.14);
  ctx.lineTo(x, y+s*.32); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.20)'; ctx.lineWidth=Math.max(1,s*.05); ctx.stroke();
  if(done){
    ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2,s*.14); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x-s*.26,y-s*.62); ctx.lineTo(x-s*.06,y-s*.42); ctx.lineTo(x+s*.28,y-s*.88);
    ctx.stroke(); ctx.lineCap='butt';
  } else {
    fillRR(x-s*.30,y-s*.84,s*.60,s*.42,s*.10,'#fff');
    ctx.fillStyle=col;
    ctx.fillRect(x-s*.20,y-s*.74,s*.40,Math.max(1.5,s*.07));
    ctx.fillRect(x-s*.20,y-s*.60,s*.26,Math.max(1.5,s*.07));
  }
}

/* ---- render/props.js ---- */
// Verge dressing: poles, trees, hoardings, hand pumps, chai stalls, dogs, bunting.

function drawProp(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  if(cx < -80 || cx > DW+80) return;

  if(o.type==='pole'){
    var h=2.4*p;
    ctx.fillStyle='#8d8577';
    ctx.fillRect(cx-Math.max(1,p*.016), y-h, Math.max(2,p*.032), h);
    ctx.fillRect(cx-p*.11, y-h, p*.22, Math.max(1.5,p*.018));
    /* drooping wire */
    ctx.strokeStyle='rgba(40,40,40,0.5)'; ctx.lineWidth=Math.max(1,p*.008);
    ctx.beginPath(); ctx.moveTo(cx, y-h+p*.02);
    ctx.quadraticCurveTo(cx - o.x*p*0.9, y-h+p*.30, cx - o.x*p*1.9, y-h+p*.04);
    ctx.stroke();
    return;
  }
  if(o.type==='tree'){
    var th=1.2*p;
    ctx.fillStyle='#7d5b3a';
    ctx.fillRect(cx-Math.max(1,p*.022), y-th, Math.max(2,p*.044), th);
    var sway=Math.sin(S.t*1.4+o.seed)*p*.02;
    circle(cx+sway, y-th-p*.36, p*.46,'#5f8f43');
    circle(cx-p*.30+sway, y-th-p*.18, p*.32,'#6ea04d');
    circle(cx+p*.28+sway, y-th-p*.20, p*.30,'#4f7d38');
    circle(cx+sway, y-th-p*.62, p*.30,'#6ea04d');
    return;
  }
  if(o.type==='hoarding'){
    var hw=1.5*p, hh=0.8*p, hy=y-1.9*p;
    ctx.fillStyle='#7b7268';
    ctx.fillRect(cx-p*.03, hy+hh, p*.06, 1.1*p);
    fillRR(cx-hw/2, hy, hw, hh, p*.02, '#f0e6d2');
    var band = pick2(o.seed,['#d24d3e','#2f7fbf','#2f8f5f']);
    fillRR(cx-hw/2, hy, hw, hh*.34, p*.02, band);
    ctx.fillStyle='rgba(0,0,0,0.30)';
    ctx.fillRect(cx-hw*.38, hy+hh*.52, hw*.72, Math.max(2,hh*.10));
    ctx.fillRect(cx-hw*.38, hy+hh*.72, hw*.48, Math.max(2,hh*.09));
    return;
  }
  if(o.type==='handpump'){
    ctx.fillStyle='#5f6a72';
    ctx.fillRect(cx-p*.02, y-p*.5, p*.04, p*.5);
    ctx.fillRect(cx-p*.02, y-p*.52, p*.16, p*.05);
    fillRR(cx-p*.14, y-p*.08, p*.28, p*.08, p*.01, '#8d8577');
    return;
  }
  if(o.type==='chai'){
    var sw=1.0*p, sh=0.66*p, sy=y-sh;
    /* counter */
    fillRR(cx-sw/2, sy+sh*.42, sw, sh*.58, p*.015, '#a9713e');
    /* awning */
    poly([[cx-sw*.62,sy+sh*.42],[cx+sw*.62,sy+sh*.42],[cx+sw*.5,sy],[cx-sw*.5,sy]], '#2f7fbf');
    ctx.fillStyle='rgba(255,255,255,0.55)';
    for(var i=0;i<4;i++) ctx.fillRect(cx-sw*.5+i*sw*.26, sy, sw*.13, sh*.42);
    /* kettle + steam */
    circle(cx-sw*.18, sy+sh*.36, p*.07, '#6f7a80');
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=Math.max(1,p*.012);
    var st=(S.t*1.6+o.seed)%1;
    ctx.beginPath();
    ctx.moveTo(cx-sw*.18, sy+sh*.28);
    ctx.quadraticCurveTo(cx-sw*.10, sy+sh*.10-st*p*.2, cx-sw*.18, sy-st*p*.3);
    ctx.stroke();
    /* stools */
    circle(cx+sw*.30, y-p*.06, p*.06, '#6b5540');
    return;
  }
  if(o.type==='dog'){
    var trot = Math.sin(S.t*6+o.seed);
    var dw=0.42*p, dh=0.26*p, dy=y-dh;
    fillRR(cx-dw/2, dy, dw, dh*.72, p*.03, '#c99a63');
    fillRR(cx+dw*.26, dy-dh*.42, dw*.30, dh*.46, p*.02, '#c99a63');
    ctx.fillStyle='#b1834f';
    ctx.fillRect(cx-dw*.36, dy+dh*.6, dw*.12, dh*.42+trot*p*.01);
    ctx.fillRect(cx+dw*.20, dy+dh*.6, dw*.12, dh*.42-trot*p*.01);
    ctx.strokeStyle='#c99a63'; ctx.lineWidth=Math.max(1.5,p*.02); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx-dw*.48, dy+dh*.15);
    ctx.quadraticCurveTo(cx-dw*.70, dy-dh*.2-trot*p*.03, cx-dw*.62, dy-dh*.5);
    ctx.stroke(); ctx.lineCap='butt';
    return;
  }
}

/* bunting strung across the street */
function drawBunting(o,rel){
  var p=ppuAt(rel);
  var yTop = yAt(rel) - 2.6*p;
  var xl = sxAt(-2.0, rel, S.px), xr = sxAt(2.0, rel, S.px);
  var sag = p*0.55 + Math.sin(S.t*1.2+o.seed)*p*0.05;
  ctx.strokeStyle='rgba(60,50,40,0.55)'; ctx.lineWidth=Math.max(1,p*.008);
  ctx.beginPath(); ctx.moveTo(xl,yTop); ctx.quadraticCurveTo((xl+xr)/2, yTop+sag, xr, yTop); ctx.stroke();
  var cols=[C.saffron,'#ffffff',C.green,'#2f7fbf','#d24d3e'];
  var n=11;
  for(var i=1;i<n;i++){
    var t=i/n;
    var bx=(1-t)*(1-t)*xl + 2*(1-t)*t*((xl+xr)/2) + t*t*xr;
    var by=(1-t)*(1-t)*yTop + 2*(1-t)*t*(yTop+sag) + t*t*yTop;
    var fs=Math.max(3,p*.07);
    poly([[bx-fs*.5,by],[bx+fs*.5,by],[bx,by+fs*1.3]], cols[i%cols.length]);
  }
}

/* ---- render/obstacles.js ---- */
// Things in the road: cows, autos, thelas, potholes, scooters, tempos.

function drawObstacle(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px), s=p;

  if(o.type!=='pothole'){
    ctx.globalAlpha=.22;
    ctx.beginPath(); ctx.ellipse(cx,y,s*.34,Math.max(1.5,s*.07),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
    ctx.globalAlpha=1;
  }

  if(o.type==='pothole'){
    ctx.beginPath(); ctx.ellipse(cx,y,s*.34,Math.max(2,s*.11),0,0,6.2832); ctx.fillStyle='#41403a'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,y-s*.02,s*.26,Math.max(1.5,s*.075),0,0,6.2832); ctx.fillStyle='#2a2925'; ctx.fill();
    ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.ellipse(cx-s*.06,y+s*.01,s*.12,Math.max(1,s*.03),0,0,6.2832); ctx.fillStyle='#6f8fa0'; ctx.fill();
    ctx.globalAlpha=1;
    return;
  }

  if(o.type==='cow'){
    var chew = Math.sin(S.t*3+o.seed)*s*.012;
    var bh=s*.62, bw=s*.54;
    fillRR(cx-bw/2, y-bh, bw, bh*.70, s*.07, '#f4eee2');
    ctx.fillStyle='#7a5b41';
    ctx.beginPath(); ctx.ellipse(cx-bw*.16,y-bh*.60,bw*.17,bh*.15,0,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+bw*.20,y-bh*.38,bw*.14,bh*.13,0,0,6.2832); ctx.fill();
    ctx.fillStyle='#ddd6c8';
    ctx.fillRect(cx-bw*.36,y-bh*.30,bw*.15,bh*.30);
    ctx.fillRect(cx+bw*.21,y-bh*.30,bw*.15,bh*.30);
    /* hump */
    ctx.beginPath(); ctx.arc(cx, y-bh*.72, bw*.20, Math.PI, 0); ctx.fillStyle='#f4eee2'; ctx.fill();
    /* head */
    fillRR(cx-bw*.23, y-bh*1.20+chew, bw*.46, bh*.48, s*.05, '#f8f3e9');
    fillRR(cx-bw*.12, y-bh*.88+chew, bw*.24, bh*.17, s*.04, '#e3c2bb');
    ctx.strokeStyle='#cbb79a'; ctx.lineWidth=Math.max(1.6,s*.032); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx-bw*.19,y-bh*1.18+chew); ctx.quadraticCurveTo(cx-bw*.36,y-bh*1.38+chew,cx-bw*.27,y-bh*1.47+chew);
    ctx.moveTo(cx+bw*.19,y-bh*1.18+chew); ctx.quadraticCurveTo(cx+bw*.36,y-bh*1.38+chew,cx+bw*.27,y-bh*1.47+chew);
    ctx.stroke(); ctx.lineCap='butt';
    circle(cx-bw*.11,y-bh*1.03+chew,Math.max(1,s*.022),C.ink);
    circle(cx+bw*.11,y-bh*1.03+chew,Math.max(1,s*.022),C.ink);
    return;
  }

  if(o.type==='auto'){
    var aw=s*.62, ah=s*.70;
    ctx.beginPath();
    ctx.moveTo(cx-aw/2,y-ah*.56); ctx.quadraticCurveTo(cx,y-ah*1.10,cx+aw/2,y-ah*.56);
    ctx.closePath(); ctx.fillStyle='#1f6f4f'; ctx.fill();
    fillRR(cx-aw/2,y-ah*.58,aw,ah*.44,s*.04,'#f3c51e');
    fillRR(cx-aw*.30,y-ah*.54,aw*.60,ah*.22,s*.03,'#2c3b44');
    fillRR(cx-aw*.42,y-ah*.18,aw*.84,ah*.10,s*.02,'#2c2c2c');
    fillRR(cx-aw*.17,y-ah*.35,aw*.34,ah*.12,s*.02,C.paper);
    circle(cx-aw*.36,y-ah*.08,s*.075,'#25272b');
    circle(cx+aw*.36,y-ah*.08,s*.075,'#25272b');
    return;
  }

  if(o.type==='thela'){
    var cw=s*.72, ch=s*.38;
    circle(cx-cw*.28,y-ch*.16,s*.10,'#3a3a3a');
    circle(cx+cw*.28,y-ch*.16,s*.10,'#3a3a3a');
    fillRR(cx-cw/2,y-ch-s*.10,cw,ch,s*.03,'#b5793f');
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(cx-cw/2,y-ch*.44-s*.10,cw,ch*.12);
    var cols=['#e2483d','#f6a723','#6cbf46','#e2483d','#f6a723','#8e5fb0'];
    for(var i=0;i<6;i++) circle(cx-cw*.36+i*cw*.145, y-ch-s*.17, s*.06, cols[i]);
    /* umbrella */
    ctx.fillStyle='#7b7268'; ctx.fillRect(cx+cw*.30, y-ch-s*.72, s*.02, s*.6);
    ctx.beginPath(); ctx.arc(cx+cw*.31, y-ch-s*.70, s*.26, Math.PI, 0);
    ctx.fillStyle='#d24d3e'; ctx.fill();
    return;
  }

  if(o.type==='scooter'){
    var sw=s*.40, sh=s*.48;
    circle(cx-sw*.42,y-s*.075,s*.08,'#2b2b2b');
    circle(cx+sw*.42,y-s*.075,s*.08,'#2b2b2b');
    fillRR(cx-sw*.5,y-sh*.62,sw,sh*.36,s*.04,'#3f79b8');
    fillRR(cx-sw*.16,y-sh*.98,sw*.44,sh*.38,s*.03,'#2f5f95');
    ctx.fillStyle='#2b2b2b'; ctx.fillRect(cx-sw*.5,y-sh*1.04,sw*.11,sh*.44);
    return;
  }

  /* tempo / Horn OK truck coming the other way */
  var tw=s*.86, th=s*1.0;
  fillRR(cx-tw/2,y-th,tw,th*.60,s*.05,'#2f6db5');
  fillRR(cx-tw*.46,y-th*1.18,tw*.92,th*.24,s*.04,'#e94f37');
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillRect(cx-tw*.30,y-th*1.10,tw*.60,Math.max(2,th*.05));
  fillRR(cx-tw*.34,y-th*.92,tw*.68,th*.26,s*.03,'#cfe4ef');
  fillRR(cx-tw*.40,y-th*.44,tw*.80,th*.16,s*.02,'#20344f');
  fillRR(cx-tw/2,y-th*.26,tw,th*.13,s*.02,'#e9c84f');
  circle(cx-tw*.34,y-th*.34,s*.05,'#fff3c4');
  circle(cx+tw*.34,y-th*.34,s*.05,'#fff3c4');
  circle(cx-tw*.38,y-th*.10,s*.095,'#25272b');
  circle(cx+tw*.38,y-th*.10,s*.095,'#25272b');
  return;
}

/* ---- render/effects.js ---- */
// Paper bundles on the road, dust puffs, and a paper in flight.

function drawPickup(o,rel){
  var p=ppuAt(rel), y=yAt(rel), cx=sxAt(o.x,rel,S.px);
  var bob=Math.sin(S.t*4+o.z)*p*.04;
  var w=p*.30,h=p*.22;
  ctx.globalAlpha=.2;
  ctx.beginPath(); ctx.ellipse(cx,y,w*.7,Math.max(1.5,p*.04),0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;
  var yy=y-h-p*.10+bob;
  fillRR(cx-w/2,yy,w,h,p*.02,C.paper);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.fillRect(cx-w/2,yy+h*.36,w,h*.10); ctx.fillRect(cx-w/2,yy+h*.64,w,h*.10);
  ctx.fillStyle=C.paperInk; ctx.fillRect(cx-w*.30,yy+h*.14,w*.60,Math.max(1,h*.11));
  ctx.strokeStyle='#c6a86f'; ctx.lineWidth=Math.max(1,p*.012);
  ctx.beginPath(); ctx.moveTo(cx,yy); ctx.lineTo(cx,yy+h); ctx.stroke();
}
function drawDust(d){
  var rel = d.z - S.trackPos;
  if(rel<1.2 || rel>40) return;
  var p=ppuAt(rel);
  ctx.globalAlpha = clamp(d.t,0,1)*0.42;
  circle(sxAt(d.x,rel,S.px), yAt(rel) - (1-d.t)*p*0.16,
         Math.min(46, d.r*(0.6+(1-d.t)*0.8)*p), '#e5d6b4');
  ctx.globalAlpha=1;
}
function drawShot(s){
  /* start at the rider's hand, end where the paper actually lands */
  var relEnd = Math.max(1.4, s.landZ - S.trackPos);
  var pEnd = ppuAt(relEnd);
  var ex = sxAt(s.landX, relEnd, S.px);
  var ey = yAt(relEnd) - pEnd*0.06;
  var sx0 = DW/2 + s.side*104, sy0 = DH-190;
  var t = s.t;
  var x = sx0 + (ex-sx0)*t;
  var y = sy0 + (ey-sy0)*t - Math.sin(t*Math.PI)*82;
  var size = 44*(1-t) + Math.max(12, pEnd*0.17)*t;

  /* motion trail */
  ctx.globalAlpha=0.22;
  for(var k=1;k<=3;k++){
    var tt=Math.max(0,t-k*0.05);
    var tx2=sx0+(ex-sx0)*tt, ty2=sy0+(ey-sy0)*tt-Math.sin(tt*Math.PI)*82;
    circle(tx2,ty2,size*0.30,C.paper);
  }
  ctx.globalAlpha=1;

  ctx.save(); ctx.translate(x,y); ctx.rotate(s.spin*s.side);
  fillRR(-size*.5,-size*.30,size,size*.60,size*.14,C.paper);
  ctx.fillStyle=C.paperInk; ctx.fillRect(-size*.30,-size*.14,size*.60,Math.max(1.5,size*.10));
  ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.fillRect(-size*.30,size*.06,size*.40,Math.max(1,size*.07));
  ctx.restore();
}

/* ---- render/rider.js ---- */
// The rider, drawn from behind: bike, basket, handlebar, mirrors and arms.

function drawRider(){
  var lean=clamp(S.lean,-.9,.9);
  var wob=Math.sin(S.t*10)*1.2 + (S.stun>0?Math.sin(S.t*40)*7:0);
  ctx.save();
  ctx.translate(DW/2 + lean*34 + wob, DH);
  ctx.rotate(lean*0.05);

  ctx.globalAlpha=.22;
  ctx.beginPath(); ctx.ellipse(0,-4,124,22,0,0,6.2832); ctx.fillStyle='#000'; ctx.fill();
  ctx.globalAlpha=1;

  /* tank */
  ctx.beginPath();
  ctx.moveTo(-108,4); ctx.quadraticCurveTo(-94,-86,0,-106); ctx.quadraticCurveTo(94,-86,108,4);
  ctx.closePath(); ctx.fillStyle='#2c4258'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-76,4); ctx.quadraticCurveTo(-68,-74,0,-92); ctx.quadraticCurveTo(68,-74,76,4);
  ctx.closePath(); ctx.fillStyle='#3d5f7e'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-16,4); ctx.quadraticCurveTo(-10,-72,0,-90); ctx.quadraticCurveTo(10,-72,16,4);
  ctx.closePath(); ctx.fillStyle='#e8ebee'; ctx.fill();
  circle(0,-78,9,'#22303d'); circle(0,-78,5,'#8fa3b3');

  /* basket of papers */
  var bw=136, bh=58, by=-198;
  var stack = clamp(Math.ceil(S.papers/3),0,6);
  for(var i=0;i<stack;i++){
    var spread = stack>1 ? (bw*0.66/(stack-1)) : 0;
    ctx.save();
    ctx.translate(-bw*0.33 + i*spread, by+16-(i%2)*6);
    ctx.rotate(i%2?0.12:-0.10);
    fillRR(-18,-13,36,26,8, i%2?'#efe9d8':C.paper);
    ctx.fillStyle=C.paperInk; ctx.fillRect(-11,-6,22,3);
    ctx.fillStyle='rgba(0,0,0,0.14)'; ctx.fillRect(-11,1,15,3);
    ctx.restore();
  }
  ctx.strokeStyle='#3a4048'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-bw/2,by); ctx.lineTo(-bw*.40,by+bh);
  ctx.lineTo(bw*.40,by+bh); ctx.lineTo(bw/2,by); ctx.stroke();
  ctx.lineWidth=3;
  for(var k=1;k<6;k++){ var fx=-bw/2+k*(bw/6);
    ctx.beginPath(); ctx.moveTo(fx,by); ctx.lineTo(fx*.80,by+bh); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-bw*.455,by+bh*.5); ctx.lineTo(bw*.455,by+bh*.5); ctx.stroke();
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-bw*.40,by+bh); ctx.lineTo(bw*.40,by+bh); ctx.stroke();

  /* handlebar */
  ctx.strokeStyle='#242a31'; ctx.lineWidth=12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-128,-106); ctx.quadraticCurveTo(0,-148,128,-106); ctx.stroke();
  ctx.lineWidth=18; ctx.strokeStyle='#15181c';
  ctx.beginPath(); ctx.moveTo(-134,-104); ctx.lineTo(-106,-112); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(134,-104); ctx.lineTo(106,-112); ctx.stroke();
  ctx.lineCap='butt';

  mirror(-152,-182,-1); mirror(152,-182,1);

  /* hands — the throwing one lifts off the grip and swings out */
  var throwT = S.arm>0 ? 1 - (S.arm/0.34) : 0;
  drawArm(-1, S.arm>0 && S.armSide===-1 ? throwT : 0);
  drawArm( 1, S.arm>0 && S.armSide=== 1 ? throwT : 0);

  ctx.restore();
}
function drawArm(side, t){
  /* t: 0 resting on the grip, 1 full follow-through */
  var swing = Math.sin(t*Math.PI);
  var gx = side*120, gy = -110;
  var x = gx + side*swing*58;
  var y = gy - swing*66;
  var shx = side*74, shy = 34;                    // shoulder, just off the bottom edge
  /* upper arm + forearm as one tapered limb */
  ctx.strokeStyle='#42607d'; ctx.lineWidth=27; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(shx, shy);
  ctx.quadraticCurveTo(shx + side*26, (shy+y)/2 + 18 - swing*20, x, y+10);
  ctx.stroke();
  /* cuff */
  ctx.strokeStyle='#33506b'; ctx.lineWidth=27;
  ctx.beginPath();
  ctx.moveTo(x - side*4, y+22); ctx.lineTo(x, y+12); ctx.stroke();
  ctx.lineCap='butt';
  /* fist */
  ctx.save(); ctx.translate(x,y); ctx.rotate(side*(0.12+swing*0.7));
  fillRR(-19,-15,38,27,12,'#c98a5e');
  ctx.fillStyle='rgba(0,0,0,0.10)'; ctx.fillRect(-19,-2,38,4);
  ctx.restore();
}
function mirror(x,y,dir){
  ctx.strokeStyle='#242a31'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-dir*16,y+72); ctx.lineTo(x,y+18); ctx.stroke();
  ctx.lineCap='butt';
  ctx.save(); ctx.translate(x,y); ctx.rotate(dir*.20);
  fillRR(-19,-15,38,30,9,'#242a31');
  fillRR(-14,-10,28,20,6,'#9dc2d4');
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.moveTo(-14,4); ctx.lineTo(2,-10); ctx.lineTo(10,-10); ctx.lineTo(-8,8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---- render/hud.js ---- */
// Score, lives, paper count, progress, and the two throw-timing gauges.

function drawHUD(){
  var g=ctx.createLinearGradient(0,0,0,96);
  g.addColorStop(0,'rgba(10,16,26,0.55)'); g.addColorStop(1,'rgba(10,16,26,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,DW,96);

  label('LEVEL '+S.level,16,30,15,C.hudDim,'left','700');
  label(String(S.score),16,58,26,C.hud,'left','800');
  label('DELIVERED',DW-16,30,13,C.hudDim,'right','700');
  label(S.delivered+' / '+S.need,DW-16,58,26,S.delivered>=S.need?C.good:C.hud,'right','800');

  for(var i=0;i<S.lives;i++){
    var hx=DW-24-i*24, hy=80;
    ctx.beginPath(); ctx.arc(hx,hy,10,Math.PI,0);
    ctx.lineTo(hx+10,hy+3); ctx.lineTo(hx-10,hy+3); ctx.closePath();
    ctx.fillStyle='#eef3f6'; ctx.fill();
    ctx.strokeStyle='rgba(10,16,26,0.45)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#43535e'; rr(hx-9,hy-6,18,6,3); ctx.fill();
  }

  fillRR(16,80,96,30,15,'rgba(10,16,26,0.5)');
  fillRR(26,89,20,13,3,C.paper);
  ctx.fillStyle=C.paperInk; ctx.fillRect(30,93,12,2);
  label(String(S.papers),54,101,18,S.papers>0?C.hud:C.bad,'left','800');

  var prog=clamp(S.trackPos/S.trackLen,0,1);
  fillRR(16,DH-26,DW-32,8,4,'rgba(10,16,26,0.5)');
  fillRR(16,DH-26,(DW-32)*prog,8,4,C.gold);

  if(S.combo>1) label('COMBO x'+S.combo,DW/2,124,20,C.gold,'center','800');

  drawAimGauges();

  if(S.calloutT>0){
    ctx.globalAlpha=clamp(S.calloutT*1.6,0,1);
    label(S.callout,DW/2,176,26,S.calloutCol,'center','800');
    ctx.globalAlpha=1;
  }

  if(S.tutorial>0){
    ctx.globalAlpha=Math.min(1,S.tutorial/1.2);
    fillRR(24,DH-206,DW-48,96,18,C.panel);
    label('Swipe or ← → to change lane',DW/2,DH-176,15,C.hud,'center','600');
    label('Tap a side when its bar turns green',DW/2,DH-152,15,C.hud,'center','600');
    label('Only pinned houses want a paper',DW/2,DH-128,15,C.pin,'center','700');
    ctx.globalAlpha=1;
  }
}

/* the timing bar: fills as you close on the house, green = throw now */
function drawAimGauges(){
  [-1,1].forEach(function(side){
    var h = findTarget(side);
    if(!h) return;
    var rel = h.z - S.trackPos;
    if(rel > 30) return;

    var x = side<0 ? 42 : DW-42;
    var top = 236, len = 188, wBar = 20;

    /* travel of the gauge head: 30 units away at the top, landing point at the bottom */
    var err = h.z - landZ();                 // >0 too early, <0 too late
    var SPAN = 26;
    var headT = clamp((SPAN/2 - err)/SPAN, 0, 1);

    fillRR(x-wBar/2-2, top-2, wBar+4, len+4, (wBar+4)/2, 'rgba(255,255,255,0.30)');
    fillRR(x-wBar/2, top, wBar, len, wBar/2, 'rgba(10,16,26,0.72)');

    /* green band = where a throw connects */
    var tLo = clamp((SPAN/2-HIT_TOL)/SPAN,0,1), tHi = clamp((SPAN/2+HIT_TOL)/SPAN,0,1);
    var pLo = clamp((SPAN/2-PERFECT_TOL)/SPAN,0,1), pHi = clamp((SPAN/2+PERFECT_TOL)/SPAN,0,1);
    fillRR(x-wBar/2, top+len*tLo, wBar, len*(tHi-tLo), wBar/2, 'rgba(34,189,88,0.45)');
    fillRR(x-wBar/2, top+len*pLo, wBar, len*(pHi-pLo), wBar/2, 'rgba(34,189,88,0.95)');

    /* head */
    var hy = top + len*headT;
    var inZone = Math.abs(err) <= HIT_TOL;
    circle(x, hy, 11, inZone ? '#fff' : 'rgba(255,255,255,0.8)');
    circle(x, hy, 6, inZone ? C.good : C.pin);

    /* side chevron + prompt */
    var py = 208, pulse = .5+.5*Math.sin(S.t*7);
    ctx.globalAlpha = inZone ? (0.85+0.15*pulse) : 0.5;
    circle(x, py, 24, inZone ? C.good : 'rgba(255,138,21,0.85)');
    ctx.globalAlpha = 1;
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(x-side*6,py-9); ctx.lineTo(x+side*6,py); ctx.lineTo(x-side*6,py+9);
    ctx.stroke(); ctx.lineCap='butt';
    if(inZone) label('THROW', x, top+len+22, 13, C.good, 'center','800');
  });
}

/* ---- render/screens.js ---- */
// Full-screen overlays: title, street cleared, round over.

function panel(y,h){ fillRR(26,y,DW-52,h,22,C.panel); }
function button(cx,cy,w,h,txt){
  var pulse=.5+.5*Math.sin(S.t*3.4);
  ctx.globalAlpha=.18+.22*pulse;
  fillRR(cx-w/2-7,cy-h/2-7,w+14,h+14,(h+14)/2,C.pin);
  ctx.globalAlpha=1;
  fillRR(cx-w/2,cy-h/2,w,h,h/2,C.pin);
  label(txt,cx,cy+6,17,'#231505','center','800');
}
function drawTitle(){
  panel(146,392);
  /* tricolour rule */
  fillRR(150,178,100,5,3,C.saffron);
  fillRR(150,186,100,5,3,'#ffffff');
  fillRR(150,194,100,5,3,C.green);
  label('PAPER ROUND',DW/2,240,40,C.hud,'center','800');
  label('The morning round, one street at a time',DW/2,266,13,C.hudDim,'center','600');
  var lx=62,y=310;
  bullet(lx,y,    'Steady speed. You only steer.');
  bullet(lx,y+38, 'Swipe or ← → to change lane.');
  bullet(lx,y+76, 'Tap a side when its bar hits green.');
  bullet(lx,y+114,'Too early lands short, too late overshoots.');
  button(DW/2,494,190,46,'START RIDE');
  if(S.best>0) label('Best  '+S.best,DW/2,528,13,C.hudDim,'center','600');
}
function bullet(x,y,t){ circle(x-14,y-5,4,C.pin); label(t,x,y,14,C.hud,'left','500'); }
function drawClear(){
  panel(196,290);
  if(S.failed){
    label('STREET MISSED',DW/2,250,26,C.bad,'center','800');
    label('Delivered '+S.delivered+' of '+S.need+' needed',DW/2,286,15,C.hud,'center','600');
    label('Lives left  '+S.lives,DW/2,314,15,C.hudDim,'center','600');
  } else {
    label('STREET CLEARED',DW/2,250,26,C.good,'center','800');
    label('Delivered '+S.delivered+' of '+S.targets,DW/2,286,16,C.hud,'center','600');
    label('Score  '+S.score,DW/2,316,20,C.gold,'center','800');
    if(S.perfect) label('Clean round — extra life',DW/2,344,14,C.good,'center','700');
  }
  button(DW/2,436,176,44,S.failed?'RETRY':'NEXT STREET');
}
function drawOver(){
  panel(214,246);
  label('ROUND OVER',DW/2,268,28,C.bad,'center','800');
  label('Score  '+S.score,DW/2,308,20,C.hud,'center','700');
  label('Best  '+S.best,DW/2,338,17,C.gold,'center','700');
  label('Reached level '+S.level,DW/2,366,14,C.hudDim,'center','600');
  button(DW/2,420,176,44,'RIDE AGAIN');
}

/* ---- render/scene.js ---- */
// Composites one frame: background, depth-sorted world, effects, rider, then UI.

function render(){
  ctx.save();
  if(S.shake>0) ctx.translate(rnd(-S.shake,S.shake)*.5, rnd(-S.shake,S.shake)*.35);

  drawSky(); drawSkyline(); drawGround();

  var vis=[],i;
  for(i=0;i<S.objs.length;i++){
    var o=S.objs[i], rel=o.z-S.trackPos;
    if(rel<1.3 || rel>72) continue;
    if((o.kind==='obs' || o.kind==='pickup') && rel<2.1) continue;
    if(o.kind==='pickup' && o.taken) continue;
    vis.push({o:o,rel:rel});
  }
  vis.sort(function(a,b){ return b.rel-a.rel; });
  for(i=0;i<vis.length;i++){
    var v=vis[i];
    if(v.o.kind==='house') drawHouse(v.o,v.rel);
    else if(v.o.kind==='prop') drawProp(v.o,v.rel);
    else if(v.o.kind==='obs') drawObstacle(v.o,v.rel);
    else if(v.o.kind==='pickup') drawPickup(v.o,v.rel);
    else if(v.o.kind==='bunting') drawBunting(v.o,v.rel);
  }

  for(i=0;i<S.dust.length;i++) drawDust(S.dust[i]);

  for(i=0;i<S.pops.length;i++){
    var pp=S.pops[i], rel2=pp.z-S.trackPos;
    if(rel2<1.6 || rel2>40) continue;
    var p=ppuAt(rel2);
    ctx.globalAlpha=clamp(pp.t,0,1);
    label(pp.txt, sxAt(pp.x,rel2,S.px), yAt(rel2)-p*1.1-(1-pp.t)*44, 18, pp.col,'center','800');
    ctx.globalAlpha=1;
  }

  for(i=0;i<S.shots.length;i++) drawShot(S.shots[i]);

  drawRider();
  ctx.restore();

  if(S.mode==='title') drawTitle();
  else {
    drawHUD();
    if(S.mode==='clear') drawClear();
    if(S.mode==='over') drawOver();
  }
}

/* ---- main.js ---- */
/* Paper Round — entry point.
   Wires the modules together: build the first street, attach controls,
   then run a fixed update/render loop off requestAnimationFrame. */


buildLevel(1);
attachInput();

if (typeof window!=='undefined' && window.requestAnimationFrame){
  var last=performance.now();
  (function frame(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    update(dt); render(); requestAnimationFrame(frame);
  })(last);
}

/* Test seam: harnesses set globalThis.__HOOK__ before loading this module. */
if (typeof globalThis!=='undefined' && globalThis.__HOOK__){
  globalThis.__HOOK__({ S:S, update:update, render:render, buildLevel:buildLevel,
    startGame:startGame, toss:toss, setLane:setLane, findTarget:findTarget, landZ:landZ,
    nextStreet:nextStreet, press:press });
}

})();
